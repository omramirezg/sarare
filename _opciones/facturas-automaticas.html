<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facturas automáticas</title>
<script>/* ?embed=1: solo la tarjeta grande, a pantalla completa (para incrustarla en un iframe) */
if (/[?&]embed=1(&|$)/.test(location.search)) {
  document.documentElement.classList.add('embed');
  // dentro de la portada (iframe aislado): la rueda y las flechas mueven la página que la contiene
  if (window.parent !== window) {
    addEventListener('wheel', function (e) { e.preventDefault(); parent.postMessage({ sarare: 'wheel', dx: e.deltaX, dy: e.deltaY, mode: e.deltaMode }, '*'); }, { passive: false });
    addEventListener('keydown', function (e) {
      if (['ArrowDown', 'PageDown', ' ', 'ArrowUp', 'PageUp'].indexOf(e.key) < 0) return;
      e.preventDefault(); parent.postMessage({ sarare: 'key', key: e.key }, '*');
    });
  }
}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f0d;--bg2:#0f1412;--panel:#161d1a;--line:#26302c;--tx:#f2f4f3;--tx2:#98a39e;--tx3:#66716c;
  --acc:#f0a23b;--acc2:#f8cf6a;--red:#e0663a;--ok:#3fb68b;--ok2:#5fd0a5;
  --head:"Sora",sans-serif;--body:"Inter",sans-serif;--mono:"JetBrains Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--tx);font-family:var(--body);padding:44px 16px 72px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--acc);text-transform:uppercase}
h1{font-family:var(--head);font-weight:600;font-size:clamp(24px,3.2vw,34px);letter-spacing:-.01em;margin-top:8px}
.lead{color:var(--tx2);font-size:15px;line-height:1.5;margin:8px 0 26px;max-width:760px}
.frame{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  background:radial-gradient(90% 70% at 50% 40%,rgba(240,162,59,.055),transparent 60%),linear-gradient(180deg,#0f1412,#0b0f0d);
  box-shadow:0 40px 90px -40px rgba(0,0,0,.9)}
.frame.lg{width:100%;aspect-ratio:1100/620;min-height:300px}
.frame.sm{width:min(480px,100%);height:320px}
.note{font-family:var(--mono);font-size:11px;color:var(--tx2);margin:40px 0 12px;letter-spacing:.04em}
@media (max-width:560px){body{padding:28px 16px 56px}}

/* ================= componente ================= */
.ap{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);row-gap:12px;padding:15px 20px 18px;overflow:hidden;color:var(--tx);font-family:var(--body)}
.ap svg.i{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hd{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:11px;color:var(--tx2);white-space:nowrap;min-width:0}
.plate{flex:none;font-family:var(--mono);font-weight:700;font-size:10.5px;line-height:1.2;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);
  border:1px solid rgba(240,162,59,.45);border-radius:4px;padding:3px 7px;white-space:nowrap}
.hk b.gr{color:var(--ok2)}
.hk s{color:var(--tx3);text-decoration-color:rgba(224,102,58,.7)}
.hk{display:flex;align-items:center;gap:9px;overflow:hidden;min-width:0}
.hk b{display:inline-block;color:var(--tx);font-weight:500;font-variant-numeric:tabular-nums}
.hk b.am{color:var(--acc2)}
.hk .sep{color:#3b4742}
.hk .clock{color:var(--tx);font-variant-numeric:tabular-nums;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:rgba(22,29,26,.7)}
.hx{display:none}
.t-s{display:none}

.main{position:relative;display:grid;grid-template-columns:21.5% minmax(0,1fr) 35.5%;grid-template-rows:minmax(0,1fr);column-gap:14px;min-height:0}
.col{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;gap:11px}
.colL{grid-column:1;grid-row:1}.colC{grid-column:2;grid-row:1}.colR{grid-column:3;grid-row:1}
.card{position:relative;border:1px solid var(--line);border-radius:12px;min-height:0;overflow:hidden;
  background:linear-gradient(180deg,#171f1c,#121816);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 18px 36px -22px rgba(0,0,0,.9),0 2px 6px rgba(0,0,0,.28);
  transition:border-color .4s ease,box-shadow .4s ease}
.card.on{border-color:rgba(240,162,59,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 0 3px rgba(240,162,59,.07),0 0 30px -8px rgba(240,162,59,.45),0 18px 36px -22px rgba(0,0,0,.9)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none;min-width:0}
.ch>span{font-family:var(--head);font-weight:600;font-size:12px;letter-spacing:-.005em;white-space:nowrap;display:flex;align-items:center;gap:7px}
.ch>span i.n{font-style:normal;font-family:var(--mono);font-size:9px;font-weight:500;color:var(--tx3);border:1px solid var(--line);border-radius:4px;padding:1px 4px}
.card.on .ch>span i.n{color:#1d1407;background:var(--acc);border-color:var(--acc)}
.ch>span svg.i{width:13px;height:13px;color:var(--acc)}
.ch em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--tx2);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch em b{color:var(--tx);font-weight:500}

/* --- bandeja --- */
.inbox{flex:1;display:flex;flex-direction:column}
.ch .badge{font-style:normal;font-family:var(--mono);font-size:9px;color:#1d1407;background:var(--acc);border-radius:999px;padding:2px 7px;font-weight:600}
.ch .badge.z{background:#26302c;color:var(--tx2)}
.ilist{position:relative;flex:1;overflow:hidden}
.ml{position:absolute;left:0;right:0;top:0;height:var(--mh,64px);display:flex;gap:9px;padding:10px 11px 0 12px;border-bottom:1px solid rgba(38,48,44,.75);
  transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .6s ease,background-color .5s ease}
.ml::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--acc);opacity:0;transition:opacity .4s}
.ml.new{background-color:rgba(240,162,59,.07)}
.ml.new::before{opacity:1}
.av{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:600 10px/1 var(--head);color:#fff;background:var(--c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.mb{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.m1{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:11.5px;min-width:0}
.m1 b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ml:not(.new) .m1 b{font-weight:500;color:#d5dbd8}
.m1 time{font-family:var(--mono);font-size:9px;color:var(--tx3);flex:none}
.m2{font-size:10.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m3{display:flex;align-items:center;gap:5px;margin-top:1px;min-width:0}
.att{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:8.5px;line-height:1;padding:3px 6px 3px 4px;border-radius:5px;border:1px solid #2c3833;background:#0f1513;color:#d3d9d6;white-space:nowrap}
.att.xml{color:var(--tx3);padding:3px 5px}
.pi{display:inline-block;width:9px;height:11px;border-radius:1.5px;background:linear-gradient(#fff 0 58%,var(--red) 58%);position:relative;flex:none}
.mst{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:8.5px;white-space:nowrap;color:var(--tx3)}
.mst svg{width:10px;height:10px}
.mst.nueva{color:var(--acc2)}
.mst.leyendo{color:var(--acc2)}
.mst.ok{color:var(--ok2)}
.mst.rev{color:var(--acc)}
.mst .dot{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.spin{width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(248,207,106,.25);border-top-color:var(--acc2);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* --- KPIs --- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:none}
.kp{padding:9px 10px 10px;border-radius:10px;min-width:0}
.kp small{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp b{display:block;font-family:var(--head);font-weight:600;font-size:21px;line-height:1.1;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kp b.am{color:var(--acc2)}
.kp b.gr{color:var(--ok2)}
.kp b u{text-decoration:none;font-size:.62em;color:var(--tx2);font-weight:500;margin-left:2px}
.kbar{display:block;height:4px;border-radius:4px;background:#222b27;margin-top:7px;overflow:hidden}
.kbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#2f9e76,var(--ok2));transform-origin:left;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.ksub{display:block;font-family:var(--mono);font-size:8.5px;color:var(--tx3);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ksub s{text-decoration-color:rgba(224,102,58,.8)}

/* --- visor --- */
.viewer{flex:1;display:flex;flex-direction:column}
.vt{display:flex;align-items:center;gap:10px;padding:7px 10px 7px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--tx2);white-space:nowrap;flex:none;min-width:0}
.vt .vf{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden}
.vt .vf b{color:var(--tx);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.vt .vp{margin-left:auto;color:var(--tx3)}
.vt .vtm{display:flex;align-items:center;gap:5px;padding:3px 7px;border-radius:6px;background:#0f1513;border:1px solid var(--line);color:var(--tx);font-variant-numeric:tabular-nums}
.vt .vtm svg{width:11px;height:11px;color:var(--acc)}
.vt .vtm.run svg{animation:spin 2s linear infinite}
.vt .ai{font-weight:600;font-size:9px;letter-spacing:.06em;color:#1d1407;background:linear-gradient(135deg,var(--acc2),var(--acc));border-radius:5px;padding:3px 6px}
.cvs{position:relative;flex:1;overflow:hidden;
  background:radial-gradient(60% 55% at 50% 45%,rgba(240,162,59,.07),transparent 70%),radial-gradient(rgba(152,163,158,.10) 1px,transparent 1.2px) 0 0/16px 16px,#0d1210}
.idle{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:9px;font-family:var(--mono);font-size:10px;color:var(--tx3);white-space:nowrap}
.idle svg{width:30px;height:30px;color:#34413b}

/* hoja (diseñada a 420×543 y escalada) */
.paper{position:absolute;left:0;top:0;width:420px;height:543px;transform-origin:0 0;z-index:2}
.pw{position:absolute;inset:0;transform-origin:50% 50%}
.pp{position:absolute;inset:0;border-radius:4px;overflow:hidden;color:#2b302d;font-family:var(--body);font-size:10.5px;line-height:1.28;
  background:
    linear-gradient(115deg,rgba(255,255,255,.65),transparent 32%,transparent 75%,rgba(0,0,0,.035)),
    linear-gradient(180deg,#fdfcf9,#f5f3ec);
  box-shadow:0 0 0 1px rgba(0,0,0,.08),0 26px 50px -18px rgba(0,0,0,.9),0 6px 14px rgba(0,0,0,.4)}
.band{position:absolute;left:0;right:0;top:0;height:5px;background:var(--sc)}
.pin{position:absolute;inset:0;padding:24px 22px 16px;display:flex;flex-direction:column}
.ih{display:flex;gap:10px;align-items:flex-start}
.logo{width:44px;height:44px;border-radius:9px;background:var(--sc);display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.logo svg{width:26px;height:26px}
.sup{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sn{display:inline-block;align-self:flex-start;font-weight:700;font-size:12.5px;line-height:1.18;color:#1b201d;letter-spacing:-.01em;max-width:100%}
.sup span{font-size:8.2px;color:#6b716d;white-space:nowrap}
.sup span i{font-style:normal;font-family:var(--mono);color:#2b302d;font-size:8.6px}
.feb{flex:none;width:136px;border:1px solid #dcd7cb;border-radius:5px;padding:7px 9px 7px;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px;background:#fff}
.feb .t{font-size:6.6px;letter-spacing:.11em;text-transform:uppercase;color:#6b716d;font-weight:700;line-height:1.3}
.feb .n{display:inline-block;font-family:var(--mono);font-weight:600;font-size:15px;color:#1b201d;margin:1px 0 2px}
.feb span{font-size:7.6px;color:#6b716d}
.feb span i{font-style:normal;font-family:var(--mono);color:#2b302d;font-size:8.4px}
.hr{height:1px;background:#e4e0d6;margin:12px 0 10px;flex:none}
.cli{display:grid;grid-template-columns:1.25fr 1fr;gap:4px 16px;font-size:8.2px;color:#6b716d}
.cli>div{display:flex;flex-direction:column;gap:1px;padding-left:7px;border-left:2px solid #e4e0d6}
.cli .lb{font-size:6.6px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:#8a908c}
.cli b{color:#2b302d;font-weight:600;font-size:9px}
table.it{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:13px;font-size:8.2px}
.it th{background:#ecE9e0;color:#5d635f;font-size:6.6px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;text-align:left;padding:5px 5px}
.it td{padding:6px 5px;border-bottom:1px solid #ebe7de;color:#2b302d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it tr:nth-child(2n) td{background:rgba(0,0,0,.018)}
.it .r{text-align:right}
.it td.r{font-family:var(--mono);font-size:7.9px}
.it td.cd{font-family:var(--mono);font-size:7.2px;color:#7a807c}
.son{margin-top:9px;font-size:7.6px;font-style:italic;color:#5d635f;line-height:1.35}
.son b{font-style:normal;font-weight:600;color:#3a403c}
.mid{display:flex;gap:12px;margin-top:12px;align-items:flex-start}
table.tx{width:190px;flex:none;border-collapse:collapse;font-size:7.4px;border:1px solid #e6e2d8}
.tx th{background:#f2efe8;color:#6b716d;font-size:6.2px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;text-align:left;padding:4px 5px}
.tx td{padding:4px 5px;border-top:1px solid #ebe7de;color:#3a403c;white-space:nowrap}
.tx .r{text-align:right}.tx td.r{font-family:var(--mono);font-size:7.2px}
.obs{flex:1;min-width:0;font-size:7.2px;color:#6b716d;line-height:1.45;padding:5px 8px;border:1px dashed #ddd8cc;border-radius:4px}
.obs .lb{display:block;font-size:6.2px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:#8a908c;margin-bottom:2px}
.bt{margin-top:auto;display:flex;gap:11px;align-items:flex-end}
.qr{width:70px;height:70px;flex:none;padding:4px;background:#fff;border:1px solid #e1ddd2;border-radius:3px}
.qr svg{display:block;width:100%;height:100%}
.cufe{flex:1;min-width:0;font-size:6.6px;color:#7a807c;line-height:1.4;align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end}
.cufe b{font-size:6.6px;letter-spacing:.11em;color:#5d635f;font-weight:700}
.cufe code{display:block;font-family:var(--mono);font-size:6.4px;word-break:break-all;color:#4a504c;margin:2px 0 5px;line-height:1.35}
.tot{flex:none;width:150px;font-size:8.4px}
.tot>div{display:flex;justify-content:space-between;align-items:center;padding:3.5px 6px;color:#5d635f}
.tot i{font-style:normal;font-family:var(--mono);color:#2b302d;font-size:8.6px}
.tot .g{background:#1e2724;color:#e9ece9;border-radius:4px;font-weight:600;margin-top:3px;padding:6px 6px}
.tot .g i{color:#fff;font-weight:600;font-size:10px}
.ftr{margin-top:11px;padding-top:7px;border-top:1px dashed #d9d4c8;font-size:6.2px;color:#8a908c;display:flex;justify-content:space-between;gap:10px;white-space:nowrap}
/* sello */
.stamp{position:absolute;right:34px;top:318px;transform:rotate(-9deg);display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 14px 6px;border:3px double currentColor;border-radius:7px;opacity:0;mix-blend-mode:multiply;pointer-events:none}
.stamp b{font-family:var(--body);font-weight:700;font-size:25px;letter-spacing:.07em;line-height:1.05}
.stamp small{font-family:var(--mono);font-size:7.4px;letter-spacing:.06em;font-weight:600;text-transform:uppercase}
.stamp.ok{color:#23946b}
.stamp.wa{color:#d0552a}
/* capa IA sobre la hoja */
.ov{position:absolute;inset:0;pointer-events:none}
.tint{position:absolute;inset:0;border-radius:4px;clip-path:inset(0 0 100% 0);opacity:0;
  background-color:rgba(240,162,59,.04);
  background-image:linear-gradient(rgba(240,162,59,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(240,162,59,.13) 1px,transparent 1px);background-size:12px 12px}
.scan{position:absolute;left:-14px;right:-14px;top:0;height:0;opacity:0}
.scan::before{content:"";position:absolute;left:14px;right:14px;bottom:0;height:70px;background:linear-gradient(180deg,transparent,rgba(240,162,59,.20))}
.scan i{position:absolute;left:0;right:0;top:-1.5px;height:3px;border-radius:3px;
  background:linear-gradient(90deg,transparent,#fff4dc 12%,#fff4dc 88%,transparent);
  box-shadow:0 0 8px 2px rgba(255,226,170,.95),0 0 26px 8px rgba(240,162,59,.5)}
.scan em{position:absolute;right:14px;top:-22px;font:600 9px/1 var(--mono);font-style:normal;letter-spacing:.06em;color:#1d1407;background:var(--acc);padding:4px 7px;border-radius:5px 5px 0 5px;white-space:nowrap}
.bx{position:absolute;border:1.6px solid #e2901f;border-radius:4px;background:rgba(240,162,59,.14);box-shadow:0 0 0 3px rgba(240,162,59,.13),0 0 14px rgba(240,162,59,.35);opacity:0;transition:border-color .35s,background-color .35s,box-shadow .35s}
.bx b{position:absolute;left:calc(100% + 5px);top:50%;transform:translateY(-50%);font:600 8.6px/1 var(--mono);background:var(--acc);color:#1d1407;padding:3px 5px;border-radius:4px;white-space:nowrap;letter-spacing:.02em;transition:background-color .35s,color .35s}
.bx.up b{left:-1.6px;top:auto;bottom:calc(100% + 3px);transform:none}
.bx.in b{left:44.5%;font-size:7.6px;padding:2.5px 5px}
.ap:not(.lg) .bx.in b{display:block;font-size:11px}
.ap.xs .bx.in b{display:none}
.bx.got{border-color:#2a9a70;background:rgba(63,182,139,.10);box-shadow:0 0 0 2px rgba(63,182,139,.10)}
.bx.got b{background:#3fb68b;color:#04170f}
.bx.wa{border-color:#e0663a;background:rgba(224,102,58,.15);box-shadow:0 0 0 3px rgba(224,102,58,.15),0 0 16px rgba(224,102,58,.45)}
.bx.wa b{background:#e0663a;color:#1f0b04}

/* --- registro extraído --- */
.rec{flex:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"prov prov nit" "num fecha sub" "iva tot tot";gap:6px;padding:9px 10px 10px}
.cell{position:relative;min-width:0;border:1px solid #232c28;border-radius:8px;padding:6px 8px 6px;background:rgba(11,15,13,.5);transition:border-color .4s,background-color .4s}
.cell[data-c=prov]{grid-area:prov}.cell[data-c=nit]{grid-area:nit}.cell[data-c=num]{grid-area:num}.cell[data-c=fecha]{grid-area:fecha}
.cell[data-c=sub]{grid-area:sub}.cell[data-c=iva]{grid-area:iva}.cell[data-c=tot]{grid-area:tot}
.cell small{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);white-space:nowrap}
.cell .cv{display:block;margin-top:3px;height:15px;font-family:var(--mono);font-size:11px;line-height:15px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell[data-c=prov] .cv{font-family:var(--body);font-weight:500;font-size:11.5px}
.cell .cv:empty::before{content:"";display:inline-block;vertical-align:middle;width:62%;height:6px;border-radius:3px;background:linear-gradient(90deg,#1f2824,#28322e,#1f2824)}
.cell[data-c=tot]{border-color:rgba(240,162,59,.22);background:linear-gradient(90deg,rgba(240,162,59,.07),rgba(11,15,13,.5))}
.cell[data-c=tot] .cv{color:var(--acc2);font-weight:600;font-size:12.5px}
.cell .cf{position:absolute;right:7px;top:6px;display:flex;align-items:center;gap:3px;font-family:var(--mono);font-size:8px;color:var(--ok2);opacity:0;transition:opacity .3s}
.cell .cf svg{width:9px;height:9px}
.cell.full .cf{opacity:1}
.cell.full{border-color:rgba(63,182,139,.28)}

/* --- conciliación --- */
.mt{flex:none}
.m3w{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px 10px 9px}
.mrail{position:absolute;top:16px;height:2px;border-radius:2px;background:#26302c;overflow:hidden}
.mrail i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#2f9e76,var(--ok2))}
.mrail i.w{background:linear-gradient(90deg,#2f9e76 0 50%,var(--acc) 62%,var(--red))}
.mc{position:relative;min-width:0;border:1px solid #232c28;border-radius:9px;padding:10px 9px 8px;background:rgba(11,15,13,.55);transition:border-color .4s,background-color .4s}
.mc.ok{border-color:rgba(63,182,139,.38)}
.mc.wa{border-color:rgba(240,162,59,.6);background:linear-gradient(180deg,rgba(240,162,59,.09),rgba(11,15,13,.55))}
.ck{position:absolute;left:50%;top:0;width:17px;height:17px;margin:-9px 0 0 -8.5px;border-radius:50%;display:grid;place-items:center;background:#161d1a;border:1.5px solid #34413b;color:#0b0f0d;z-index:1}
.ck svg{width:10px;height:10px;stroke-width:2.2;opacity:0}
.mc.ok .ck{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 3px rgba(63,182,139,.18),0 0 12px rgba(63,182,139,.55)}
.mc.wa .ck{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 3px rgba(240,162,59,.2),0 0 12px rgba(240,162,59,.6)}
.mc.ok .ck svg.c,.mc.wa .ck svg.w{opacity:1}
.ck svg.w{position:absolute}
.mtop{display:flex;align-items:center;gap:6px;min-width:0}
.mtop svg{width:14px;height:14px;color:var(--tx2)}
.mc.ok .mtop svg{color:var(--ok2)}.mc.wa .mtop svg{color:var(--acc2)}
.mtop b{font-family:var(--mono);font-weight:600;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlb{display:block;font-size:9px;color:var(--tx3);margin:2px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv{display:block;font-family:var(--mono);font-size:10px;line-height:1.5;color:#d8dedb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv.q{color:var(--tx2)}
.mc.wa .mv.p{color:var(--acc2)}
.mc .mv:empty::before{content:"";display:inline-block;vertical-align:middle;width:70%;height:5px;border-radius:3px;background:#222b27}
.mc .mtop b:empty::before{content:"";display:inline-block;vertical-align:middle;width:46px;height:6px;border-radius:3px;background:#28322e}
.dtag{position:absolute;right:6px;top:-8px;font-family:var(--mono);font-size:8.5px;font-weight:600;color:#1d1407;background:var(--acc);border-radius:4px;padding:2px 5px;opacity:0;z-index:2;white-space:nowrap}
.vd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 10px 10px;min-height:34px}
.ap.lg .vd{height:62px;align-content:flex-start;row-gap:7px}
.rl{flex-basis:100%;font-family:var(--mono);font-size:9px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
.rl u{text-decoration:none;color:var(--ok2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;font-family:var(--mono);font-size:10px;line-height:1;border:1px solid;white-space:nowrap}
.pill svg{width:11px;height:11px;stroke-width:2}
.pill.ok{color:var(--ok2);background:rgba(63,182,139,.11);border-color:rgba(63,182,139,.38)}
.pill.wa{color:var(--acc2);background:rgba(240,162,59,.11);border-color:rgba(240,162,59,.45)}
.pill.hm{color:var(--tx);background:rgba(224,102,58,.12);border-color:rgba(224,102,58,.45)}
.pill.wait{color:var(--tx3);border-color:#26302c;border-style:dashed}
.pill i{font-style:normal;opacity:.7}

/* --- libro contable --- */
.ledger{flex:1;display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:58px minmax(0,1fr) 88px 74px;column-gap:10px;align-items:center;padding:0 12px}
.lth{height:23px;flex:none;font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);border-bottom:1px solid var(--line);background:rgba(11,15,13,.35)}
.lth .r,.lr .r{text-align:right}
.lb{position:relative;flex:1;overflow:hidden}
.lr{position:absolute;left:0;right:0;top:0;height:var(--lh,28px);border-bottom:1px solid rgba(38,48,44,.65);font-size:11px;
  transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .6s ease}
.lr>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .ln{font-family:var(--mono);font-size:10px;color:var(--acc2)}
.lr .lp{color:#dfe4e1}
.lr .lt{font-family:var(--mono);font-size:10.5px;color:var(--tx)}
.lr .hl{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(63,182,139,.20),rgba(63,182,139,.04) 60%,transparent);box-shadow:inset 2px 0 0 var(--ok)}
.lr.rv .hl{background:linear-gradient(90deg,rgba(240,162,59,.22),rgba(240,162,59,.04) 60%,transparent);box-shadow:inset 2px 0 0 var(--acc)}
.st{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9px;padding:3px 7px 3px 6px;border-radius:999px;border:1px solid}
.st svg{width:9px;height:9px;stroke-width:2.2}
.st.ok{color:var(--ok2);background:rgba(63,182,139,.09);border-color:rgba(63,182,139,.3)}
.st.rv{color:var(--acc2);background:rgba(240,162,59,.09);border-color:rgba(240,162,59,.36)}

/* --- reporte del día --- */
.sum{grid-column:2 / 4;grid-row:1;position:relative;z-index:5;display:grid;place-items:center;border-radius:12px;pointer-events:none;opacity:0;visibility:hidden;
  background:radial-gradient(70% 60% at 50% 50%,rgba(11,15,13,.55),rgba(11,15,13,.88));-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.sum.on{visibility:visible}
.sc{width:min(88%,420px);border:1px solid rgba(240,162,59,.5);border-radius:14px;padding:18px 18px 16px;text-align:left;
  background:linear-gradient(180deg,#1b2420,#131a17);box-shadow:0 0 0 4px rgba(240,162,59,.06),0 0 50px -10px rgba(240,162,59,.45),0 30px 60px -20px rgba(0,0,0,.9)}
.s1{display:flex;align-items:center;gap:10px}
.si{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#1d1407;flex:none}
.si svg{width:18px;height:18px;stroke-width:1.8}
.s1 small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc2)}
.s1 strong{display:block;font-family:var(--head);font-weight:600;font-size:15px;margin-top:2px}
.sb{display:block;font-family:var(--head);font-weight:600;font-size:25px;letter-spacing:-.01em;margin:14px 0 10px;white-space:nowrap}
.sb em{font-style:normal;color:var(--acc2)}
.sb i{font-style:normal;color:#3b4742;margin:0 .2em}
.sbar{display:flex;height:6px;border-radius:6px;overflow:hidden;background:#222b27;gap:2px}
.sbar i{display:block;height:100%}
.sbar .g{background:linear-gradient(90deg,#2f9e76,var(--ok2))}
.sbar .a{background:var(--acc)}
.sp{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-family:var(--mono);font-size:9.5px;white-space:nowrap}
.sp .o{color:var(--ok2)}.sp .w{color:var(--acc2)}
.sk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sk>div{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:rgba(11,15,13,.45);min-width:0}
.sk b{display:block;font-family:var(--head);font-weight:600;font-size:16px;white-space:nowrap}
.sk small{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk .g{color:var(--ok2)}.sk .a{color:var(--acc2)}
.ap.sm .sk,.ap.xs .sk{display:none}
.sf{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-family:var(--mono);font-size:9px;color:var(--tx2);white-space:nowrap}
.sf svg{width:11px;height:11px;color:var(--ok2)}

/* --- aviso de correo (modos compactos) y estado --- */
.toast{position:absolute;left:8px;right:8px;top:8px;z-index:6;display:none;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;border:1px solid rgba(240,162,59,.45);
  background:rgba(22,29,26,.97);box-shadow:0 12px 26px -10px rgba(0,0,0,.85),0 0 20px -6px rgba(240,162,59,.4);opacity:0;min-width:0}
.toast .av{width:22px;height:22px;font-size:9px;border-radius:7px}
.toast .tb{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.toast .tb b{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .tb b svg{width:10px;height:10px;vertical-align:-1px;margin-right:4px;color:var(--acc2)}
.toast .att{align-self:flex-start}
.stp{position:absolute;left:50%;bottom:12px;z-index:4;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:6px 12px 6px 10px;border-radius:999px;
  border:1px solid #2c3833;background:rgba(17,23,20,.94);box-shadow:0 10px 24px -10px rgba(0,0,0,.85);font-family:var(--mono);font-size:10px;color:var(--tx);white-space:nowrap;max-width:calc(100% - 16px)}
.stp>span{overflow:hidden;text-overflow:ellipsis}
.stp svg{width:11px;height:11px;stroke-width:2}
.stp.ok{border-color:rgba(63,182,139,.45);color:var(--ok2)}
.stp.wa{border-color:rgba(240,162,59,.5);color:var(--acc2)}
.stp.idle{color:var(--tx2)}
.stp .pd{width:6px;height:6px;border-radius:50%;background:var(--tx3)}

/* partículas */
.fx{position:absolute;inset:0;pointer-events:none;z-index:20}
.chip{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:500;line-height:1;padding:4px 9px 4px 4px;border-radius:7px;white-space:nowrap;will-change:transform,opacity;
  color:var(--tx);background:rgba(19,26,23,.97);border:1px solid rgba(240,162,59,.75);box-shadow:0 0 0 3px rgba(240,162,59,.10),0 0 22px rgba(240,162,59,.45),0 10px 22px rgba(0,0,0,.6)}
.chip em{font-style:normal;font-size:8px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#1d1407;background:var(--acc);padding:3px 5px;border-radius:4px}
.chip.g{border-color:rgba(63,182,139,.8);box-shadow:0 0 0 3px rgba(63,182,139,.10),0 0 22px rgba(63,182,139,.45),0 10px 22px rgba(0,0,0,.6)}
.chip.g em{background:var(--ok);color:#04170f}
.chip.w{border-color:rgba(240,162,59,.85)}
.fpdf{position:absolute;left:0;top:0;width:24px;height:30px;border-radius:3px;will-change:transform,opacity;
  background:linear-gradient(225deg,#d9d5ca 0 6px,#fff 6px);box-shadow:0 8px 18px rgba(0,0,0,.6),0 0 18px rgba(240,162,59,.5)}
.fpdf::after{content:"PDF";position:absolute;left:0;right:0;bottom:4px;font:700 6.5px/1 var(--mono);text-align:center;color:#fff;background:var(--red);padding:2px 0}

/* ================= modos compactos ================= */
.ap.md,.ap.sm,.ap.xs{row-gap:9px;padding:11px 13px 13px}
.ap.md .colL,.ap.sm .colL,.ap.xs .colL{display:none}
.ap.md .main{grid-template-columns:minmax(0,1fr) 55%;column-gap:10px}
.ap.sm .main{grid-template-columns:minmax(0,1fr) 55%;column-gap:9px}
.ap.xs .main{grid-template-columns:minmax(0,1fr) 54%;column-gap:7px}
.ap.md .colC,.ap.sm .colC,.ap.xs .colC{grid-column:1}
.ap.md .colR,.ap.sm .colR,.ap.xs .colR{grid-column:2;gap:8px}
.ap.md .sum,.ap.sm .sum,.ap.xs .sum{grid-column:1 / -1}
.ap.md .hx,.ap.sm .hx{display:inline}
.ap.sm .hx3{display:none}
.ap.nar .t-l{display:none}.ap.nar .t-s{display:inline}
.ap.md .hl0,.ap.sm .hl0,.ap.xs .hl0{display:none}
.ap.md .toast,.ap.sm .toast,.ap.xs .toast{display:flex}
.ap.md .vt .vp,.ap.sm .vt .vp,.ap.xs .vt .vp{display:none}
.ap.md .vt .vf b{max-width:100%}
.ap:not(.lg) .bx b{display:none}
.ap:not(.lg) .scan em{display:none}
.ap:not(.lg) .card{border-radius:10px}
.ap:not(.lg) .ch{padding:6px 10px}
.ap:not(.lg) .ch>span{font-size:11px}
.ap:not(.lg) .ch em{font-size:8.5px}
.ap:not(.lg) .stp{font-size:9px;padding:4px 9px 4px 8px;bottom:6px;gap:6px}
.ap:not(.lg) .stp svg{width:10px;height:10px}
/* md */
.ap.md .hd{font-size:10px}
.ap.md .plate{font-size:9.5px}
.ap.md .grid{grid-template-areas:"prov prov nit" "num iva tot";gap:5px;padding:7px 8px 8px}
.ap.md .cell[data-c=fecha],.ap.md .cell[data-c=sub]{display:none}
.ap.md .cell{padding:4px 7px 5px}
.ap.md .cell small{font-size:7.5px}
.ap.md .cell .cv{font-size:10px;height:13px;line-height:13px;margin-top:2px}
.ap.md .cell[data-c=prov] .cv{font-size:10.5px}
.ap.md .cell[data-c=tot] .cv{font-size:11px}
.ap.md .cell .cf{top:4px;right:5px}
.ap.md .m3w{gap:8px;padding:13px 8px 7px}
.ap.md .mrail{top:13px}
.ap.md .mc{padding:9px 7px 6px}
.ap.md .mlb,.ap.md .mv.q,.ap.md .lth{display:none}
.ap.md .mtop{margin-bottom:3px}
.ap.md .mtop b{font-size:10px}
.ap.md .mtop svg{width:12px;height:12px}
.ap.md .mv{font-size:9px;line-height:1.45}
.ap.md .vd{padding:0 8px 8px;min-height:28px;gap:5px}
.ap.md .pill{font-size:9px;padding:4px 8px 4px 7px;gap:5px}
.ap.md .lrow{grid-template-columns:50px minmax(0,1fr) 76px 64px;column-gap:7px;padding:0 9px}
.ap.md .lth{height:19px;font-size:7.5px}
.ap.md .lr{font-size:10px}
.ap.md .lr .ln{font-size:9px}.ap.md .lr .lt{font-size:9.5px}
.ap.md .st{font-size:8px;padding:2px 5px}
.ap.md .vt{font-size:9px;padding:5px 8px}
/* sm */
.ap.sm .hd{font-size:9px}
.ap.sm .plate{font-size:8.5px;padding:2px 6px}
.ap.sm .hk{gap:6px}
.ap.sm .hk .clock{padding:2px 6px}
.ap.sm .grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"prov prov" "num tot";gap:5px;padding:6px 7px 7px}
.ap.sm .cell[data-c=nit],.ap.sm .cell[data-c=fecha],.ap.sm .cell[data-c=sub],.ap.sm .cell[data-c=iva]{display:none}
.ap.sm .cell{padding:3px 6px 4px;border-radius:6px}
.ap.sm .cell small{font-size:7px}
.ap.sm .cell .cv{font-size:9.5px;height:12px;line-height:12px;margin-top:1px}
.ap.sm .cell[data-c=prov] .cv{font-size:10px}
.ap.sm .cell[data-c=tot] .cv{font-size:10px}
.ap.sm .cell .cf{top:3px;right:5px;font-size:7px}
.ap.sm .m3w{gap:6px;padding:11px 7px 6px}
.ap.sm .mrail{top:11px}
.ap.sm .mc{padding:8px 6px 5px;border-radius:7px}
.ap.sm .mlb,.ap.sm .mv.q{display:none}
.ap.sm .mtop{gap:4px;margin-bottom:2px}
.ap.sm .mtop b{font-size:8.5px}
.ap.sm .mtop svg{width:10px;height:10px}
.ap.sm .mv{font-size:8.5px}
.ap.sm .ck{width:14px;height:14px;margin:-7.5px 0 0 -7px}
.ap.sm .ck svg{width:8px;height:8px}
.ap.sm .dtag{font-size:7.5px;top:-7px;right:3px;padding:1px 4px}
.ap.sm .vd{padding:0 7px 7px;min-height:24px;gap:4px}
.ap.sm .pill{font-size:8.5px;padding:3px 7px 3px 6px;gap:4px}
.ap.sm .pill svg{width:9px;height:9px}
.ap.sm .lrow{grid-template-columns:minmax(0,1fr) 70px 58px;column-gap:6px;padding:0 8px}
.ap.sm .lrow .ln{display:none}
.ap.sm .lth{display:none}
.ap.sm .lr{font-size:9.5px}.ap.sm .lr .lt{font-size:9px}
.ap.sm .st{font-size:7.5px;padding:2px 5px;gap:3px}
.ap.sm .st svg{width:7px;height:7px}
.ap.sm .vt{font-size:8.5px;padding:4px 7px;gap:6px}
.ap.sm .vt .ai{display:none}
.ap.sm .sc,.ap.xs .sc{padding:12px 13px 11px;width:min(92%,300px)}
.ap.sm .sb{font-size:19px;margin:9px 0 8px}
.ap.sm .s1 strong{font-size:13px}
.ap.sm .sp,.ap.xs .sp{font-size:8.5px}
.ap.sm .sf{margin-top:8px;padding-top:7px;font-size:8px}
.ap.sm .t-l,.ap.xs .t-l{display:none}
.ap.sm .t-s,.ap.xs .t-s{display:inline}
/* xs */
.ap.xs{padding:9px 10px 8px;row-gap:7px}
.ap.xs .hd{font-size:8px;gap:6px}
.ap.xs .plate{font-size:7.5px;padding:2px 5px;letter-spacing:.06em}
.ap.xs .hk .clock{padding:1px 5px}
.ap.xs .rec .ch,.ap.xs .mt .ch,.ap.sm .rec .ch,.ap.sm .mt .ch{display:none}
.ap.xs .grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"prov" "tot";gap:4px;padding:5px}
.ap.xs .cell:not([data-c=prov]):not([data-c=tot]){display:none}
.ap.xs .cell{padding:3px 5px;border-radius:5px}
.ap.xs .cell small{font-size:6.5px}
.ap.xs .cell .cv{font-size:8.5px;height:11px;line-height:11px;margin-top:1px}
.ap.xs .cell[data-c=prov] .cv,.ap.xs .cell[data-c=tot] .cv{font-size:9px}
.ap.xs .cell .cf{display:none}
.ap.xs .m3w{gap:5px;padding:10px 5px 4px}
.ap.xs .mrail{top:10px}
.ap.xs .mc{padding:7px 3px 4px;border-radius:6px;text-align:center}
.ap.xs .mtop{justify-content:center;gap:3px}
.ap.xs .mtop b{font-size:7px}
.ap.xs .mtop svg{width:9px;height:9px}
.ap.xs .mlb,.ap.xs .mv{display:none}
.ap.xs .ck{width:13px;height:13px;margin:-7px 0 0 -6.5px}
.ap.xs .ck svg{width:7.5px;height:7.5px}
.ap.xs .dtag{display:none}
.ap.xs .vd{padding:0 5px 5px;min-height:20px;gap:3px}
.ap.xs .pill{font-size:7.5px;padding:3px 6px 3px 5px;gap:3px}
.ap.xs .pill svg{width:8px;height:8px}
.ap.xs .ledger{display:none}
.ap.xs .vt{font-size:7.5px;padding:3px 6px;gap:5px}
.ap.xs .vt .ai,.ap.xs .vt .vf .pi{display:none}
.ap.xs .vt .vtm{padding:1px 5px}
.ap.xs .vt .vtm svg{width:9px;height:9px}
.ap.xs .stp{display:none}
.ap.xs .toast{left:5px;right:5px;top:5px;padding:4px 6px;gap:5px;border-radius:7px}
.ap.xs .toast .av{width:16px;height:16px;font-size:7px;border-radius:5px}
.ap.xs .toast .tb b{font-size:8px}

function letras(n){
  const U = ['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const D = ['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const C = ['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const c999 = x => { if (!x) return ''; if (x === 100) return 'cien'; const r = x % 100; const t = r < 30 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' y ' + U[r % 10] : ''); return (C[Math.floor(x / 100)] + ' ' + t).trim(); };
  const apoc = s => s.replace(/veintiuno$/, 'veintiún').replace(/uno$/, 'un');
  const m = Math.floor(n / 1e6), k = Math.floor(n % 1e6 / 1e3), u = n % 1e3, out = [];
  if (m) out.push(m === 1 ? 'un millón' : apoc(c999(m)) + ' millones');
  if (k) out.push(k === 1 ? 'mil' : apoc(c999(k)) + ' mil');
  if (u) out.push(c999(u));
  const s = out.join(' ') + (m && !k && !u ? ' de' : '') + ' pesos m/cte.';
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function qrSVG(seed){
  const N = 25, r = mulberry(seed);
  const finder = (x, y) => {
    for (const [ox, oy] of [[0, 0], [N - 7, 0], [0, N - 7]]){
      const u = x - ox, v = y - oy;
      if (u >= -1 && u <= 7 && v >= -1 && v <= 7){
        if (u < 0 || v < 0 || u > 6 || v > 6) return 0;
        const m = Math.max(Math.abs(u - 3), Math.abs(v - 3));
        return m === 3 || m <= 1 ? 1 : 0;
      }
    }
    return -1;
  };
  let d = '';
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    let on = finder(x, y);
    if (on < 0){
      const ax = Math.abs(x - 18), ay = Math.abs(y - 18);
      if (ax <= 2 && ay <= 2) on = Math.max(ax, ay) !== 1;
      else if (y === 6) on = x % 2 === 0;
      else if (x === 6) on = y % 2 === 0;
      else on = r() < .48;
    }
    if (on) d += `M${x} ${y}h1v1h-1z`;
  }
  return `<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges"><path d="${d}" fill="#1b201d"/></svg>`;
}

function createAP(root){

  /* ---------- tiempo que se detiene fuera de pantalla ---------- */
  function sleep(ms, my){
    return new Promise(res => {
      let left = ms, last = performance.now();
      const tick = () => {
        const now = performance.now();
        if (!paused) left -= now - last;
        last = now;
        if (gen !== my || left <= 0) return res();
        setTimeout(tick, paused ? 220 : Math.min(left, 120));
      };
      setTimeout(tick, Math.min(ms, 120));
    });
  }
  const chk = my => { if (gen !== my) throw STOP; };
  const done = a => a.finished.then(() => {}, () => {});
  const held = new Set();
  function setPaused(p){
    if (p === paused) return;
    paused = p;
    if (p){ root.getAnimations({subtree: true}).forEach(a => { if (a.playState === 'running'){ a.pause(); held.add(a); } }); }
    else { held.forEach(a => { if (a.playState === 'paused') a.play(); }); held.clear(); }
  }
  const updPause = () => setPaused(!vis || document.hidden);
  const anim = (el, fr, o) => INST ? {finished: Promise.resolve()} : el.animate(fr, o);

      if (k === 'proc') e.textContent = cnt.proc;

      else if (k === 'rev') e.textContent = cnt.rev;
      else if (k === 'tot') e.textContent = cop(cnt.tot);
      else if (k === 'bar') e.style.transform = `scaleX(${pct / 100})`;

  function bumpK(keys){

    keys.forEach(k => root.querySelectorAll(`b[data-k="${k}"]`).forEach(e => {
      if (e.offsetWidth) e.animate([{transform: 'translateY(-4px)', color: '#f8cf6a'}, {transform: 'none'}], {duration: 560, easing: POP});
    }));
  }
  function paintUnread(){ E.unread.textContent = unread ? `${unread} nueva${unread > 1 ? 's' : ''}` : 'al día'; E.unread.classList.toggle('z', !unread); }

  /* ---------- estado narrado ---------- */

  /* ---------- vuelos ---------- */
  const bez = (a, b, c, t) => (1 - t) * (1 - t) * a + 2 * (1 - t) * t * b + t * t * c;
  function arc(sx, sy, ex, ey, lift, extra){
    const cx = (sx + ex) / 2, cy = Math.min(sy, ey) - lift, fr = [];
    for (let i = 0; i <= 14; i++){ const t = i / 14; fr.push({offset: t, transform: `translate(${bez(sx, cx, ex, t).toFixed(1)}px,${bez(sy, cy, ey, t).toFixed(1)}px) ${extra(t)}`}); }

  function chip(fromEl, toEl, label, text, cls, delay, dur){
    return new Promise(res => {
      const R = root.getBoundingClientRect(), a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
      const c = document.createElement('div');
      c.className = 'chip ' + cls;
      c.innerHTML = (label ? `<em>${label}</em>` : '') + text;
      if (mode === 'sm' || mode === 'xs'){ c.style.fontSize = '8.5px'; c.style.padding = '3px 6px 3px 3px'; }
      E.fx.appendChild(c);
      const cw = c.offsetWidth, ch = c.offsetHeight;
      const sx = a.left + a.width / 2 - R.left - cw / 2, sy = a.top + a.height / 2 - R.top - ch / 2;
      const ex = b.left - R.left + 2, ey = b.top + b.height / 2 - R.top - ch / 2;
      const lift = mode === 'lg' ? 40 + Math.random() * 40 : 14 + Math.random() * 16;
      const fr = arc(sx, sy, ex, ey, lift, t => `scale(${(t < .18 ? .55 + t / .18 * .5 : 1.05 - (t - .18) * .25).toFixed(3)})`);
      fr.forEach(f => { f.opacity = f.offset < .1 ? f.offset * 10 : f.offset > .88 ? Math.max(0, (1 - f.offset) / .12) : 1; });
      c.style.opacity = '0';
      const an = c.animate(fr, {duration: dur, delay, easing: 'cubic-bezier(.45,0,.2,1)', fill: 'backwards'});
      an.finished.then(() => { c.remove(); res(true); }, () => { c.remove(); res(false); });
    });
  }

      setMail(mail, 'leyendo');
      from = mail.el.querySelector('.att.pdf');
    } else {
      const t = E.toast;
      t.querySelector('.av').style.setProperty('--c', v.col);
      t.querySelector('.av').textContent = v.ini;
      t.querySelector('.tb b').innerHTML = `${I.mail}${mode === 'xs' ? v.short : 'Factura ' + v.num + ' · ' + v.short}`;
      t.querySelector('.att em').textContent = v.num + '.pdf';
      t.style.opacity = '1';
      await done(anim(t, [{opacity: 0, transform: 'translateY(-130%)'}, {opacity: 1, transform: 'none'}], {duration: 460, easing: OUT})); chk(my);
      await sleep(420, my); chk(my);
      from = t.querySelector('.att');
    }
    status('run', `abriendo ${v.num}.pdf`);
    E.file.textContent = `${v.num}.pdf`;
    E.idle.style.opacity = '0';
    P = makePaper(v);
    P.pw.style.opacity = '0';
    await flyPdf(from, P, my); chk(my);
    if (!lg){
      anim(E.toast, [{opacity: 1, transform: 'none'}, {opacity: 0, transform: 'translateY(-130%)'}], {duration: 380, easing: 'ease-in'});
      E.toast.style.opacity = '0';
    }
    unread = Math.max(0, unread - 1); paintUnread();
    await sleep(160 * sp, my); chk(my);

    // B · lectura con IA
    focus(E.rec); clearRec();
    status('run', 'la IA está leyendo la factura');
    await scan(P, my); chk(my);
    await sleep(120 * sp, my); chk(my);

    // C · extracción de campos
    status('run', `extrayendo ${FIELDS.filter(f => E.cell(f.k).offsetWidth > 0).length} campos`);
    await extract(P, my); chk(my);
    await sleep(260 * sp, my); chk(my);

    // D · conciliación a 3 vías
    if (onMatch) onMatch();
    focus(E.mt);
    status('run', `conciliando con ${v.oc} y ${v.rec}`);
    await match(P, my); chk(my);

    // E · contabilización
    focus(mode === 'xs' ? null : E.ledger);
    cnt.proc++; cnt.tot += v.tot;
    if (v.ok) cnt.ok++; else cnt.rev++;
    timerOn = false; E.vtm.classList.remove('run');
    status(v.ok ? 'ok' : 'wa', v.ok ? `aprobada → contabilidad · ${tVal.toFixed(1).replace('.', ',')} s` : lg || mode === 'md' ? `diferencia ${cop(v.diff)} → revisión humana` : `dif. ${cop(v.diff)} → revisión`);
    if (lg) setMail(mail, v.ok ? 'ok' : 'rev');
    const row = mode === 'xs' ? null : addLedger({num: v.num, short: v.short, tot: v.tot, st: v.ok ? 'ok' : 'rev'}, true);
    if (row){
      const pill = E.vd.firstElementChild;
      chip(pill, row.querySelector('.lt'), '', `${v.num} · ${cop(v.tot)}`, v.ok ? 'g' : 'w', 0, 620 * sp);
    }
    paintK(); bumpK(['proc', v.ok ? 'pct' : 'rev', 'tot']);
    await sleep(1100 * sp, my); chk(my);

    // F · la hoja se archiva
    focus(null);
    const old = P; P = null;
    await done(anim(old.pw, [{opacity: 1, transform: 'none'}, {opacity: 0, transform: 'translateY(-16px) scale(.95)'}], {duration: 420 * sp, easing: 'ease-in', fill: 'forwards'}));
    old.el.remove();
    chk(my);
  }

  async function summary(my){
    focus(null);
    status('sum', 'generando el reporte del día');
    const n = cnt.proc, o = cnt.ok, w = cnt.rev;
    E.sum.querySelector('[data-s=n]').textContent = n;
    E.sum.querySelector('[data-s=v]').textContent = '$' + NB + (cnt.tot / 1e6).toFixed(1).replace('.', ',') + NB + 'M';
    E.sum.querySelector('[data-s=o]').textContent = mode === 'xs' ? `${o} automáticas` : `${o} aprobadas automáticamente`;
    E.sum.querySelector('[data-s=w]').textContent = mode === 'xs' ? `${w} en revisión` : `${w} en revisión humana`;
    E.sum.querySelector('[data-s=p]').textContent = Math.round(o / n * 100) + NB + '%';
    E.sum.querySelector('[data-s=h]').textContent = '≈' + NB + (n * (360 - 8) / 3600).toFixed(1).replace('.', ',') + NB + 'h';
    E.sum.querySelector('.sbar .g').style.flex = String(o);
    E.sum.querySelector('.sbar .a').style.flex = String(w);
    E.sum.classList.add('on');
    E.sum.style.opacity = '1';
    await done(anim(E.sum, [{opacity: 0}, {opacity: 1}], {duration: 420, easing: 'ease-out'})); chk(my);
    anim(E.sc, [{opacity: 0, transform: 'translateY(14px) scale(.95)'}, {opacity: 1, transform: 'none'}], {duration: 520, easing: POP});
    anim(E.sum.querySelector('.sbar'), [{clipPath: 'inset(0 100% 0 0)'}, {clipPath: 'inset(0 0 0 0)'}], {duration: 900, delay: 300, easing: EASE, fill: 'backwards'});
    status('ok', 'reporte del día listo');
    await sleep(3900, my); chk(my);
    await done(anim(E.sum, [{opacity: 1}, {opacity: 0}], {duration: 420, easing: 'ease-in'}));
    E.sum.style.opacity = '0';
    E.sum.classList.remove('on');
    chk(my);
    // nuevo lote: los indicadores vuelven a la mañana
    cnt = {...START};
    root.querySelectorAll('b[data-k]').forEach(e => anim(e, [{opacity: 0}, {opacity: 1}], {duration: 600, easing: 'ease-out'}));
    paintK();
    status('idle', 'nuevo lote · esperando facturas');
  }

  async function run(my){
    try {
      await sleep(450, my); chk(my);
      let pre = null, i = 0;
      while (gen === my){
        const v = INV[ORDER[i % ORDER.length]];
        let mail = pre; pre = null;
        if (!mail){
          if (mode === 'lg') status('idle', `correo nuevo · ${v.num}.pdf`);
          mail = arrive(v);
          await sleep(mode === 'lg' ? 900 : 120, my); chk(my);
        }
        const last = (i % ORDER.length) === ORDER.length - 1;
        await processInvoice(v, mail, my, () => { if (!last && mode === 'lg') pre = arrive(INV[ORDER[(i + 1) % ORDER.length]]); });
        chk(my);
        resetMatch(); clearRec();
        E.file.textContent = 'esperando factura…';
        E.idle.style.opacity = '1';
        i++;
        if (i % ORDER.length === 0){ await summary(my); await sleep(700, my); chk(my); }
        else await sleep(mode === 'lg' ? 260 : 420, my);
      }
    } catch (err){
      if (err === STOP || gen !== my) console.debug('[facturas] ciclo anterior detenido por reinicio');
      else console.error('[facturas] el ciclo se detuvo:', err);
    }
  }

  /* ---------- cuadro fijo (movimiento reducido) ---------- */
  function still(){
    INST = true;
    const v = INV[0];
    const m = arrive(v);
    unread = 0; paintUnread();
    if (m) setMail(m, 'ok');
    E.idle.style.opacity = '0';
    P = makePaper(v);
    E.file.textContent = `${v.num}.pdf`;
    FIELDS.forEach(f => { P.fields[f.k].el.style.opacity = '1'; P.fields[f.k].el.classList.add('got'); fillCell(f.k, v); });
    resetMatch(); fillMatch(v);
    ['oc', 'rc', 'fe'].forEach(k => E.mc(k).classList.add('ok'));
    E.railI.style.transform = 'scaleX(1)';
    verdict(v); stamp(P);
    cnt.proc++; cnt.ok++; cnt.tot += v.tot;
    if (mode !== 'xs') addLedger({num: v.num, short: v.short, tot: v.tot, st: 'ok'}, false);
    paintK();
    tVal = 7.8; paintTimer();
    status('ok', `aprobada → contabilidad · 7,8 s`);
    INST = false;
  }

  /* ---------- arranque ---------- */
  function start(){
    gen++;
    const my = gen;
    root.getAnimations({subtree: true}).forEach(a => { if (!(window.CSSAnimation && a instanceof CSSAnimation)) a.cancel(); });
    held.clear();
    build();
    mode = modeOf(root.clientWidth, root.clientHeight);
    root.className = 'ap ' + mode + (mode === 'md' && root.clientWidth < 780 ? ' nar' : '');
    cnt = {...START};
    mails = []; lrows = []; P = null; unread = 0; timerOn = false; tVal = 0;
    mh = Math.max(58, Math.min(66, (E.ilist.clientHeight || 300) / 4.6));
    measureLedger();
    if (mode === 'lg'){
      OLD.slice().reverse().forEach(o => { const d = new Date(Date.now() - o.ago * 6e4); const m = {...o, time: d.getDate() === HOY.getDate() ? hhmm(d) : 'ayer'}; m.el = mailEl(m); setMail(m, o.st === 'rev' ? 'rev' : 'ok'); E.ilist.prepend(m.el); mails.unshift(m); });
      placeMails();
    }
    OLD.slice().reverse().forEach(o => addLedger(o, false));
    paintK(); paintUnread(); paintTimer();
    layoutPaper(); placeRail(); resetMatch();
    // las cajas internas pueden cambiar de alto sin que cambie el contenedor (fuentes, contenido)
    if (inner) inner.disconnect();
    let it = 0;
    inner = new ResizeObserver(() => { clearTimeout(it); it = setTimeout(() => { if (gen === my) relayout(); }, 60); });
    [E.lb, E.cvs, E.ilist, E.m3w].forEach(e => inner.observe(e));
    if (RM.matches){ still(); return; }
    run(my);
  }

  function relayout(){
    root.classList.toggle('nar', mode === 'md' && root.clientWidth < 780);
    layoutPaper(); placeRail(); measureLedger(); placeLedger();
    if (mode === 'lg'){ mh = Math.max(58, Math.min(66, E.ilist.clientHeight / 4.6)); root.style.setProperty('--mh', mh + 'px'); placeMails(); }
  }

  new IntersectionObserver(es => { vis = es[es.length - 1].isIntersecting; updPause(); }, {threshold: .02}).observe(root);
  document.addEventListener('visibilitychange', updPause);
  setInterval(() => { if (!paused && E.clock) paintClock(); }, 1000);
  setInterval(() => { if (timerOn && !paused){ tVal += .1; paintTimer(); } }, 100);
  let lastW = 0, lastH = 0, rt = 0;
  new ResizeObserver(() => {
    const w = root.clientWidth, h = root.clientHeight;
    if (Math.abs(w - lastW) < 2 && Math.abs(h - lastH) < 2) return;
    lastW = w; lastH = h;
    clearTimeout(rt);
    rt = setTimeout(() => { if (modeOf(w, h) !== mode || RM.matches) start(); else relayout(); }, 140);
  }).observe(root);
  RM.addEventListener('change', start);
  lastW = root.clientWidth; lastH = root.clientHeight;
  start();
}

// incrustada (?embed=1): una sola instancia, la grande
const EMBED = document.documentElement.classList.contains('embed');
const boot = () => document.querySelectorAll(EMBED ? '.frame.lg .ap' : '.ap').forEach(createAP);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot, err => { console.warn('[facturas] fuentes no cargadas:', err); boot(); });
else boot();
})();
</script>
</body></html>
