<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rutas de entrega</title>
<script>/* ?embed=1: solo la tarjeta grande, a pantalla completa (para incrustarla en un iframe) */
if (/[?&]embed=1(&|$)/.test(location.search)) {
  document.documentElement.classList.add('embed');
  // dentro de la portada (iframe aislado): la rueda y las flechas mueven la página que la contiene
  if (window.parent !== window) {
    addEventListener('wheel', function (e) { e.preventDefault(); parent.postMessage({ sarare: 'wheel', dx: e.deltaX, dy: e.deltaY, mode: e.deltaMode }, '*'); }, { passive: false });
    addEventListener('keydown', function (e) {
      if (['ArrowDown', 'PageDown', ' ', 'ArrowUp', 'PageUp'].indexOf(e.key) < 0) return;
      e.preventDefault(); parent.postMessage({ sarare: 'key', key: e.key }, '*');
    });
  }
}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f0d;--bg2:#0f1412;--pn:#121916;--line:#26302c;--tx:#f2f4f3;--tx2:#98a39e;--tx3:#6d7873;
  --amb:#f0a23b;--amb2:#f8cf6a;--red:#e0663a;--grn:#3fb68b;
  --mono:"JetBrains Mono",ui-monospace,monospace;--head:Sora,Inter,system-ui,sans-serif;--body:Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx)}
body{font-family:var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:40px 16px 56px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--amb);text-transform:uppercase}
h1{font-family:var(--head);font-weight:600;font-size:clamp(20px,2.4vw,28px);margin-top:6px;letter-spacing:-.01em}
.lead{color:var(--tx2);font-size:14.5px;margin:6px 0 20px;line-height:1.5}
.stage{position:relative;overflow:hidden;background:var(--bg2);border:1px solid var(--line);border-radius:14px;box-shadow:0 40px 90px -40px rgba(0,0,0,.9)}
.stage.lg{width:100%;aspect-ratio:1100/620;min-height:300px}
.stage.sm{width:480px;max-width:100%;height:320px}
.legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;font-family:var(--mono);font-size:11.5px;color:var(--tx2)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend .ln{width:18px;height:3px;border-radius:2px;background:var(--amb);box-shadow:0 0 6px rgba(240,162,59,.7)}
.legend .st1{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--amb);display:inline-grid;place-items:center;font-size:7px;color:var(--amb)}
.legend .ok{width:10px;height:10px;border-radius:50%;background:var(--grn)}
.legend .nw{width:9px;height:9px;transform:rotate(45deg);background:var(--amb2);box-shadow:0 0 0 3px rgba(248,207,106,.2)}
.legend .tr{width:18px;height:6px;border-radius:3px;background:linear-gradient(90deg,rgba(224,102,58,.15),rgba(224,102,58,.55),rgba(224,102,58,.15))}
.tag{font-family:var(--mono);font-size:11px;color:var(--tx3);letter-spacing:.06em;margin:30px 0 10px}

/* ================= widget ================= */
.fl{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) var(--pw,0px);background:var(--bg);overflow:hidden;font-family:var(--body);color:var(--tx)}
.fl.lg{--pw:clamp(252px,26%,292px)}
.fl.md{--pw:clamp(158px,28%,178px)}
.map{position:relative;min-width:0;min-height:0;overflow:hidden}
.map canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:11px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none;z-index:2}
.pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.05em;color:var(--tx2);white-space:nowrap;
  padding:3px 7px;border-radius:4px;background:rgba(11,15,13,.78);border:1px solid var(--line)}
.plate{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--amb);white-space:nowrap;
  padding:3px 7px;border:1px solid rgba(240,162,59,.45);border-radius:4px;background:rgba(11,15,13,.78)}
.clock{color:var(--tx);font-size:11.5px;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.clock small{font-size:9.5px;font-weight:500;color:var(--tx3);letter-spacing:.06em}
.mini{position:absolute;right:11px;bottom:9px;display:none;gap:10px;font-family:var(--mono);font-size:10px;color:var(--tx2);pointer-events:none;z-index:2;white-space:nowrap;
  padding:4px 9px;border-radius:99px;background:rgba(11,15,13,.78);border:1px solid var(--line)}
.mini b{color:var(--tx);font-weight:600}
.mini .g{color:var(--grn)}
.toast{position:absolute;left:50%;top:46px;z-index:3;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 9px;border-radius:12px;white-space:nowrap;pointer-events:none;
  background:rgba(15,20,18,.93);border:1px solid rgba(240,162,59,.38);box-shadow:0 14px 34px -12px rgba(0,0,0,.85);
  opacity:0;transform:translate(-50%,-10px) scale(.97);transition:opacity .35s ease,transform .5s cubic-bezier(.2,.9,.25,1),border-color .4s}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.toast .ti{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(240,162,59,.13);transition:background .4s}
.toast .ti i{width:7px;height:7px;border-radius:1px;transform:rotate(45deg);background:var(--amb2);transition:background .4s}
.toast .tt{font-family:var(--head);font-weight:600;font-size:12.5px;letter-spacing:-.005em;line-height:1.2}
.toast .tt em{font-style:normal;color:var(--amb2)}
.toast .ts{display:block;font-family:var(--mono);font-size:10px;color:var(--tx2);margin-top:3px;line-height:1.2}
.toast .ts .g{color:var(--grn);font-weight:600}
.toast .ts .w{color:var(--tx)}
.toast.ok{border-color:rgba(63,182,139,.45)}
.toast.ok .ti{background:rgba(63,182,139,.14)}
.toast.ok .ti i{background:var(--grn)}

/* panel */
.panel{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0;overflow:hidden;padding:14px 14px 12px;border-left:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,0) 35%),#0d1210}
.ph{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);white-space:nowrap}
.ph b{color:var(--tx2);font-weight:600}
.ph .av{color:var(--grn)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{min-width:0;padding:8px 10px 7px;border:1px solid var(--line);border-radius:10px;background:var(--pn)}
.k small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--tx2);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k b{display:block;font-family:var(--head);font-weight:600;font-size:19px;line-height:1.15;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.k b u{text-decoration:none;font-family:var(--body);font-weight:500;font-size:11px;color:var(--tx2);margin-left:3px;letter-spacing:0}
.k.g b{color:var(--grn)}
.k.a b{color:var(--amb2)}
.k.bump{border-color:rgba(240,162,59,.45)}
.k{transition:border-color .5s}
.vl{display:flex;flex-direction:column;gap:6px}
.v{position:relative;padding:8px 10px 8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--pn);overflow:hidden;transition:border-color .4s}
.v::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--c);box-shadow:0 0 8px var(--c)}
.v.hl{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.v1{display:flex;align-items:center;gap:8px;min-width:0}
.vi{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.vi svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.v1 b{font-weight:600;font-size:12.5px;white-space:nowrap}
.st{margin-left:auto;flex:none;font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:99px;border:1px solid;white-space:nowrap;transition:all .35s}
.st.r{color:var(--amb);border-color:rgba(240,162,59,.35);background:rgba(240,162,59,.08)}
.st.d{color:var(--grn);border-color:rgba(63,182,139,.4);background:rgba(63,182,139,.1)}
.st.f{color:var(--tx2);border-color:var(--line);background:rgba(255,255,255,.02)}
.v2{display:flex;align-items:center;gap:8px;margin-top:6px}
.bar{flex:1;height:4px;border-radius:4px;background:#1c2421;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:4px;background:var(--c);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.pr{font-family:var(--mono);font-size:10px;color:var(--tx2);min-width:3.2ch;text-align:right}
.v3{display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-size:10.5px;color:var(--tx2);white-space:nowrap}
.v3 span:first-child{overflow:hidden;text-overflow:ellipsis}
.v3 .eta{font-family:var(--mono);color:var(--tx);font-size:10px}
.feed{margin-top:auto;padding-top:8px;border-top:1px solid var(--line);min-height:0}
.feed h4{font-family:var(--mono);font-weight:500;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin-bottom:5px}
.fr{display:flex;gap:8px;font-size:10.5px;line-height:1.7;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:fin .5s ease}
.fr time{font-family:var(--mono);font-size:10px;color:var(--tx);opacity:.85;flex:none}
.fr span{overflow:hidden;text-overflow:ellipsis}
.fr b{font-weight:600;color:var(--tx)}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* tamaños */
.fl.md .panel{padding:10px 9px;gap:8px}
.fl.md .kpis{gap:5px}
.fl.md .k{padding:6px 7px 5px;border-radius:8px}
.fl.md .k small{font-size:8.5px}
.k .sh{display:none}.fl.md .k .sh{display:inline}.fl.md .k .fu{display:none}
.fl.md .clock small{display:none}
.fl.md .k b{font-size:14px;margin-top:1px}
.fl.md .k b u{font-size:9px}
.fl.md .vl{gap:5px}
.fl.md .v{padding:6px 7px 6px 9px;border-radius:8px}
.fl.md .v::before{top:6px;bottom:6px}
.fl.md .vi,.fl.md .v3,.fl.md .feed{display:none}
.fl.md .v1 b{font-size:11px}
.fl.md .st{font-size:8.5px;padding:1px 5px}
.fl.md .v2{margin-top:5px}
.fl.md .pr{font-size:9px}
.fl.md .ph{font-size:8.5px}
.fl.md .ph .av{display:none}
.fl.md .toast{top:42px;padding:6px 11px 6px 7px;gap:8px}
.fl.md .toast .tt{font-size:11px}
.fl.md .toast .ts{font-size:9px}
.fl.md .toast .ti,.fl.sm .toast .ti{width:20px;height:20px}
.fl.sm .panel,.fl.xs .panel{display:none}
.fl.sm .mini,.fl.xs .mini{display:flex}
.fl.sm .pill,.fl.xs .pill{font-size:9.5px}
.fl.sm .plate,.fl.xs .plate{font-size:9.5px}
.fl.sm .clock,.fl.xs .clock{font-size:10.5px}
.fl.sm .toast{top:40px;padding:6px 11px 6px 7px;gap:8px}
.fl.sm .toast .tt{font-size:11px}
.fl.sm .toast .ts{font-size:9px}
.fl.xs .hud{top:8px;left:8px;right:8px}
.fl.xs .hud .ctx1,.fl.xs .clock small{display:none}
.fl.xs .mini{right:8px;bottom:7px;font-size:9px;padding:3px 8px}
.fl.xs .toast{top:34px;padding:5px 10px 5px 6px;gap:7px;border-radius:10px}
.fl.xs .toast .ti{width:16px;height:16px}
.fl.xs .toast .ti i{width:5px;height:5px}
.fl.xs .toast .tt{font-size:10px}
.fl.xs .toast .ts{display:none}

/* modo incrustado */
html.embed,html.embed body{width:100%;height:100%;overflow:hidden}
html.embed body{display:block;min-height:0;padding:0}
html.embed .wrap{max-width:none;width:100%;height:100%;padding:0;margin:0}
html.embed .eyebrow,html.embed h1,html.embed .lead,html.embed .legend,html.embed .tag,html.embed .stage.sm{display:none}
html.embed .stage.lg{width:100%;height:100%;aspect-ratio:auto;min-height:0;border:0;border-radius:0;box-shadow:none}

@media (max-width:640px){.wrap{padding:24px 16px 40px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Sarare Tech · demostración</p>
  <h1>Rutas de entrega en tiempo real</h1>
  <p class="lead">La flota se ve en el mapa en vivo: cada pedido nuevo se asigna al vehículo más conveniente y la ruta se recalcula al instante.</p>
  <div class="stage lg" id="stage-lg" role="img" aria-label="Animación: mapa estilizado de un pueblo con motos y una camioneta de reparto siguiendo rutas, entregas confirmadas, pedidos nuevos y rutas reoptimizadas"></div>
  <div class="legend">
    <span><i class="ln"></i>ruta del vehículo</span>
    <span><i class="st1">2</i>parada pendiente</span>
    <span><i class="ok"></i>entregado</span>
    <span><i class="nw"></i>pedido nuevo</span>
    <span><i class="tr"></i>tráfico</span>
  </div>
  <p class="tag">Tarjeta pequeña · 480 × 320</p>
  <div class="stage sm" id="stage-sm" role="img" aria-label="Animación de flota de reparto en tiempo real (versión pequeña)"></div>
</div>

<script>
(() => {
'use strict';

/* ================================================================== *
 *  Constantes
 * ================================================================== */
const EMBED  = document.documentElement.classList.contains('embed');
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COL = { bg:'#0b0f0d', bg2:'#0f1412', line:'#26302c', tx:'#f2f4f3', tx2:'#98a39e', amb:'#f0a23b', amb2:'#f8cf6a', red:'#e0663a', grn:'#3fb68b' };
const FONT = { body:'Inter, system-ui, sans-serif', mono:'"JetBrains Mono", ui-monospace, monospace' };

const BS   = 64;                      // cuadra (unidades de mundo); 1 u ≈ 1,5 m
const U2M  = 1.5;
const ACT  = { i0:0, i1:14, j0:0, j1:8 };          // zona operativa (nodos ruteables)
const GRD  = { i0:-7, i1:21, j0:-7, j1:15 };       // retícula dibujada
const ROI  = { x:-34, y:-30, w:14*BS+68, h:8*BS+60 };
const SIM  = 16;                      // segundos simulados por segundo real
const ACC  = 75, DEC = 95;            // u/s²
const DWELL = 1.7, LOAD = 1.6;
const SIMSPD = 54 / SIM * 0.72;       // u por segundo simulado (promedio con frenadas), para minutos

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const easeOut = t => 1-Math.pow(1-t,3);
const easeInOut = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeBack = t => { const c1=1.70158, c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); };
const hexRgb = h => { const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; };
const rgba = (h,a) => { const c=hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
const hhmm = sec => { const m=Math.floor(sec/60); return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
const dec1 = v => v.toFixed(1).replace('.',',');

/* ================================================================== *
 *  Río (Catmull-Rom) y geometría auxiliar
 * ================================================================== */
const RIVER_CP = [[1010,-520],[905,-260],[800,-70],[756,90],[792,240],[818,350],[772,470],[676,580],[612,720],[585,900],[600,1120]];
const RHALF = 16;
const RIV = (() => {
  const out=[], cp=RIVER_CP, seg=14;
  for(let i=0;i<cp.length-1;i++){
    const p0=cp[i-1]||cp[i], p1=cp[i], p2=cp[i+1], p3=cp[i+2]||cp[i+1];
    for(let q=0;q<seg;q++){
      const t=q/seg, t2=t*t, t3=t2*t;
      out.push({ x:.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
                 y:.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3) });
    }
  }
  const l=cp[cp.length-1]; out.push({x:l[0],y:l[1]});
  return out;
})();
function distSeg(px,py,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy; let t=L?((px-ax)*dx+(py-ay)*dy)/L:0; t=clamp(t,0,1); return Math.hypot(px-ax-dx*t, py-ay-dy*t); }
function distRiver(x,y){ let m=1e9; for(let i=0;i<RIV.length-1;i++){ const a=RIV[i], b=RIV[i+1]; if(Math.abs(a.y-y)>260 && Math.abs(b.y-y)>260) continue; const d=distSeg(x,y,a.x,a.y,b.x,b.y); if(d<m) m=d; } return m; }
function segX(ax,ay,bx,by,cx,cy,dx,dy){ const d=(bx-ax)*(dy-cy)-(by-ay)*(dx-cx); if(!d) return false; const t=((cx-ax)*(dy-cy)-(cy-ay)*(dx-cx))/d, u=((cx-ax)*(by-ay)-(cy-ay)*(bx-ax))/d; return t>=0&&t<=1&&u>=0&&u<=1; }
function crossesRiver(a,b){ for(let i=0;i<RIV.length-1;i++){ const p=RIV[i], q=RIV[i+1]; if(segX(a.x,a.y,b.x,b.y,p.x,p.y,q.x,q.y)) return true; } return false; }
function riverX(y){ for(let i=0;i<RIV.length-1;i++){ const a=RIV[i], b=RIV[i+1]; if((y>=a.y&&y<=b.y)||(y<=a.y&&y>=b.y)){ const t=(y-a.y)/((b.y-a.y)||1); return a.x+(b.x-a.x)*t; } } return 1e9; }
const D1 = (x,y) => Math.abs(x+y-8*BS)/Math.SQRT2;       // diagonal 1: i+j=8
const D2 = (x,y) => Math.abs(x-y-6*BS)/Math.SQRT2;       // diagonal 2: i-j=6

/* ================================================================== *
 *  Grafo de calles
 * ================================================================== */
const N = [], E = [], GN = {};
const key = (i,j) => i+','+j;
const inAct = (i,j) => i>=ACT.i0&&i<=ACT.i1&&j>=ACT.j0&&j<=ACT.j1;
for(let j=GRD.j0;j<=GRD.j1;j++) for(let i=GRD.i0;i<=GRD.i1;i++){
  const x=i*BS, y=j*BS;
  const n={ id:N.length, x, y, i, j, mid:false, act:inAct(i,j), wet:distRiver(x,y)<RHALF+6, adj:[] };
  N.push(n); GN[key(i,j)]=n;
}
const PARK = [[5,3],[6,3]], TERM=[[9,6],[10,6]], POLI=[[1,1],[2,1]];
const REMOVED = new Set(['6,3|6,4','10,6|10,7','2,1|2,2']);
function addE(i1,j1,i2,j2,cls,line){
  const a=GN[key(i1,j1)], b=GN[key(i2,j2)]; if(!a||!b) return;
  const id=`${i1},${j1}|${i2},${j2}`;
  const e={ a:a.id, b:b.id, cls, line, removed:REMOVED.has(id), water:false, bridge:false, cong:1 };
  const cr = crossesRiver(a,b), wet = a.wet||b.wet;
  if(cr||wet){ if(line==='main'||line==='d2') e.bridge=true; else e.water=true; }
  E.push(e);
}

function dijkstra(src, ban){

    const d=hk[0], u=pop(); if(d>dist[u]) continue;
    for(const e of N[u].adj){

      const nd=d+e.w; if(nd<dist[e.to]){ dist[e.to]=nd; prev[e.to]=u; push(nd,e.to); }

    const a=rest.slice(), n=a.length, c=new Array(n).fill(0);

    ev(); let i=0;

  mkStop(id){ const n=N[id]; this.used.add(id); return { id:'P-'+(this.oid++), node:id, x:n.x, y:n.y, barrio:n.barrio, done:false, doneAt:0, veh:null }; }
  freeOK(id, minD){ if(this.used.has(id)) return false; const n=N[id]; for(const u of this.used){ const m=N[u]; if(Math.hypot(m.x-n.x,m.y-n.y)<minD) return false; } return true; }
  pickNear(x,y,count,rad){
    const out=[]; const R=this.rng;
    const cand=STOPS.filter(id=>{ const n=N[id]; return Math.hypot(n.x-x,n.y-y)<rad; });
    for(let tries=0; out.length<count && tries<400; tries++){ const id=cand[(R()*cand.length)|0]; if(id!=null && this.freeOK(id, 70)) out.push(this.mkStop(id)); }
    return out;
  }
  pickIn(bar){
    const R=this.rng;
    let cand=STOPS.filter(id=>N[id].barrio===bar && this.freeOK(id,80));
    cand=cand.filter(id=>this.V.every(v=>Math.hypot(N[id].x-v.px,N[id].y-v.py)>70));
    if(!cand.length) cand=STOPS.filter(id=>this.freeOK(id,50));
    if(!cand.length) cand=STOPS.filter(id=>!this.used.has(id));
    return this.mkStop(cand[(R()*cand.length)|0]);
  }

  /* punto de compromiso: hasta dónde la trayectoria actual es intocable */
  commit(v){
    const P=v.path, n=P.raw.length, s=v.s;
    if(v.state!=='drive' || n<2){
      let a=0; for(let i=0;i<n;i++){ if(P.vout[i]<=s+1e-3) a=i; else break; }
      return { prefix:[P.raw[a]], ban:a>0?P.raw[a-1]:null, sNew:0 };
    }
    let a=0; for(let i=0;i<n;i++){ if(P.vout[i]<=s+1e-3) a=i; else break; }
    let c=-1; for(let i=a+1;i<n;i++){ if(P.vin[i]>s+0.5){ c=i; break; } }
    if(c<0) c=n-1;
    if(c<=a) return { prefix:[P.raw[a]], ban:a>0?P.raw[a-1]:null, sNew:0 };
    return { prefix:P.raw.slice(a,c+1), ban:null, sNew:Math.max(0, s-P.vout[a]+P.dout[a]) };
  }
  setPath(v, com, order){
    const raw=com.prefix.slice(); let cur=raw[raw.length-1], prev=raw.length>1?raw[raw.length-2]:com.ban;
    const stops=[];
    for(const st of order){
      if(st.node!==cur){ const seg=route(cur, st.node, prev); for(let q=1;q<seg.length;q++) raw.push(seg[q]); prev=raw.length>1?raw[raw.length-2]:prev; cur=st.node; }
      stops.push({ st, k:raw.length-1 });
    }
    let toHub=false;
    if(!order.length){ toHub=true; if(cur!==HUB){ const seg=route(cur,HUB,prev); for(let q=1;q<seg.length;q++) raw.push(seg[q]); } }
    const P=buildPath(raw);
    P.stops=stops.map(o=>({ st:o.st, s:P.vS[o.k] }));
    P.toHub=toHub;
    computeLimits(P, v.base);
    v.path=P; v.s=Math.min(com.sNew, P.len); v.si=0;
    while(v.si<P.stops.length && P.stops[v.si].s < v.s-0.5) v.si++;
  }

  updVehicle(v, dt){
    const P=v.path;
    if(v.reveal<1) v.reveal=Math.min(1, v.reveal+dt/1.35);
    if(v.ghost){ v.ghost.a-=dt/1.0; if(v.ghost.a<=0) v.ghost=null; }
    if(v.hl>0) v.hl-=dt;
    if(v.state==='dwell'){
      v.timer-=dt;
      if(v.timer<=0){
        v.state='drive';
        if(v.si>=P.stops.length){ const com=this.commit(v); this.setPath(v, com, []); v.reveal=0; } // de vuelta al despacho
      }
    } else if(v.state==='load'){
      v.timer-=dt;
      if(v.timer<=0){
        if(v.plan.length){ v.state='drive'; }
        else this.assignBatch(v);
      }
    } else {
      const target=limAt(P, v.s);
      v.v=Math.min(v.v+ACC*dt, Math.max(target, 7));
      v.s+=v.v*dt;
      const ns=P.stops[v.si];
      if(ns && v.s>=ns.s-0.01){ v.s=ns.s; v.v=0; this.deliver(v, ns.st); v.si++; v.state='dwell'; v.timer=DWELL; }
      else if(v.s>=P.len){ v.s=P.len; v.v=0; if(P.toHub){ v.state='load'; v.timer=LOAD; } else { v.state='dwell'; v.timer=0.01; } }
    }
    const p=posAt(v.path, v.s);
    v.px=p.x; v.py=p.y; v.nx=p.nx; v.ny=p.ny;
    if(v.state==='drive' && v.path.len>0){
      const th=Math.atan2(p.ty,p.tx); let d=th-v.h; while(d>Math.PI) d-=2*Math.PI; while(d<-Math.PI) d+=2*Math.PI;
      v.h+=d*Math.min(1, dt*16);
    }
    // estela GPS
    v.tT+=dt;
    if(v.tT>0.06){ v.tT=0; const L=v.trail.length/2, lx=v.trail[((v.th-1+L)%L)*2], ly=v.trail[((v.th-1+L)%L)*2+1];
      if(v.tn===0 || Math.hypot(lx-p.x,ly-p.y)>1.5){ v.trail[v.th*2]=p.x+p.nx*v.lane*.6; v.trail[v.th*2+1]=p.y+p.ny*v.lane*.6; v.th=(v.th+1)%L; v.tn=Math.min(L, v.tn+1); } }
  }

  deliver(v, st){
    st.done=true; st.doneAt=this.clock; st.doneT=this.t; this.used.delete(st.node);
    v.plan=v.plan.filter(s=>s!==st); v.arrival=v.arrival.filter(s=>s!==st);
    v.done.push(st); if(v.done.length>3) v.done.shift();
    v.doneN++;
    this.kpi.ent++; if(this.rng()<0.955) this.kpi.on++;
    this.pins.push({ x:st.x, y:st.y, t0:this.t, label:'entregado '+hhmm(this.clock), st });
    if(this.pins.length>6) this.pins.shift();
    this.pushFeed(this.clock, `<b>${v.name}</b> entregó en ${st.barrio}`);
  }

  assignBatch(v){
    const R=this.rng;
    const bars=BARRIOS.filter(b=>!this.V.some(o=>o!==v && o.plan.some(s=>s.barrio===b)));
    const bar=(bars.length?bars:BARRIOS)[(R()*(bars.length||BARRIOS.length))|0];
    const first=this.pickIn(bar); const list=[first];
    list.push(...this.pickNear(first.x, first.y, 3+((R()*2)|0), 250));
    list.forEach(s=>s.veh=v);
    v.arrival=list.slice(); v.doneN=0;
    const com=this.commit(v); const o=bestOrder(com.prefix[com.prefix.length-1], list);
    v.plan=o.order; this.setPath(v, com, v.plan); v.reveal=0; v.state='drive'; v.v=0;
    this.kpi.ped+=list.length; this.bump('ped');
    this.chips.push({ x:N[HUB].x, y:N[HUB].y, t0:this.t, a:'lote cargado', b:`${list.length} paradas`, col:v.col });
    this.pushFeed(this.clock, `<b>${v.name}</b> cargó lote · ${list.length} paradas`);
  }

  newOrder(){
    const bar = this.evCount===0 ? 'Barrio Cofavi' : BARRIOS[(this.evCount*3+((this.rng()*2)|0))%BARRIOS.length];
    const st=this.pickIn(bar); this.evCount++;
    this.event={ st, age:0, phase:'new', cands:[], win:null };
    this.kpi.ped++; this.bump('ped');
    this.toast('new', st);
  }
  evaluate(e){
    const cands=[];
    for(const v of this.V){
      const com=this.commit(v), start=com.prefix[com.prefix.length-1];
      const cur=seqCost(start, v.plan), opt=bestOrder(start, [...v.plan, e.st]);
      const delta=opt.cost-cur;
      cands.push({ v, delta, score:delta+52*v.plan.length+(v.state==='load'?25:0), start });
    }
    cands.sort((a,b)=>a.score-b.score);
    const w=cands[0];
    // línea base sin optimizar: asignación por turno y paradas en orden de llegada
    let rv=this.V[this.rr++%this.V.length]; if(rv===w.v) rv=this.V[this.rr++%this.V.length];
    const rc=cands.find(c=>c.v===rv);
    const naive=seqCost(rc.start, [...rv.arrival, e.st]) - seqCost(rc.start, rv.plan);
    const fifoGain=seqCost(w.start, w.v.arrival) - seqCost(w.start, w.v.plan);
    const saveU=Math.max(0, naive - w.delta + Math.max(0,fifoGain));
    e.cands=cands; e.win=w.v;
    e.saveMin=clamp(Math.round(saveU/SIMSPD/60), 2, 19);
    e.saveU=saveU;
    for(const c of cands) c.min=Math.max(1, Math.round(c.delta/SIMSPD/60));
  }
  apply(e){
    const v=e.win, com=this.commit(v), start=com.prefix[com.prefix.length-1];
    e.st.veh=v;
    const o=bestOrder(start, [...v.plan, e.st]);
    v.ghost={ path:v.path, s:v.s, a:1 };
    v.plan=o.order; v.arrival.push(e.st);
    const wasLoad=v.state==='load';
    this.setPath(v, com, v.plan); v.reveal=0; v.hl=2.5;
    if(wasLoad){ v.state='drive'; v.v=0; }
    this.kpi.km+=Math.min(e.saveU*U2M/1000, 4.5);
    this.chips.push({ x:e.st.x, y:e.st.y, t0:this.t, a:'ruta optimizada', b:`−${e.saveMin} min`, col:COL.amb2, big:true });
    this.pushFeed(this.clock, `Pedido ${e.st.barrio} → <b>${v.name}</b>`);
    this.toast('done', e.st, v, e.saveMin);
  }

  step(dt){
    this.t+=dt; this.clock+=dt*SIM;
    for(const v of this.V) this.updVehicle(v, dt);
    const e=this.event;
    if(!e && this.t>=this.nextEventAt) this.newOrder();
    else if(e){
      e.age+=dt;
      if(e.phase==='new' && e.age>=0.95){ e.phase='opt'; this.evaluate(e); this.toast('opt', e.st); }
      else if(e.phase==='opt' && e.age>=2.2){ e.phase='done'; this.apply(e); }
      else if(e.phase==='done' && e.age>=5.6){ this.toastOff(); this.event=null; this.nextEventAt=this.t+2.6+this.rng()*1.4; }
    }
    for(let i=this.pins.length-1;i>=0;i--) if(this.t-this.pins[i].t0>3.4) this.pins.splice(i,1);
    for(let i=this.chips.length-1;i>=0;i--) if(this.t-this.chips[i].t0>4.4) this.chips.splice(i,1);
    this.panelT-=dt; if(this.panelT<=0){ this.panelT=0.16; this.updPanel(); }
  }

  /* ---------------- DOM: toast, panel, feed ---------------- */
  toast(kind, st, v, save){
    const T=this.toastEl;
    if(kind==='new'){ T.classList.remove('ok'); this.tt.innerHTML=`Nuevo pedido · <em>${st.barrio}</em>`; this.ts.innerHTML=`#${st.id} · recibido`; T.classList.add('on'); }
    else if(kind==='opt'){ this.ts.innerHTML=`#${st.id} · optimizando ${this.V.length} rutas…`; }
    else { T.classList.add('ok'); this.ts.innerHTML=`asignado a <span class="w">${v.name}</span> · ruta optimizada <span class="g">−${save} min</span>`; }
    const w=T.offsetWidth, h=T.offsetHeight, top=T.offsetTop;
    this.tRect={ x0:this.W/2-w/2-8, x1:this.W/2+w/2+8, y0:top-6, y1:top+h+8 };
  }
  toastOff(){ this.toastEl.classList.remove('on'); this.tRect=null; }
  hitsToast(x,y,w,h){ const r=this.tRect; return !!r && x<r.x1 && x+w>r.x0 && y<r.y1 && y+h>r.y0; }
  bump(k){ const el=this.kEl[k]; if(!el) return; el.classList.add('bump'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('bump'),700); }
  pushFeed(clock, html){ this.feed.push({ t:hhmm(clock), html }); if(this.feed.length>3) this.feed.shift(); this.feedDirty=true; }
  set(k, v){ const el=this.el[k]; if(el && el._v!==v){ el._v=v; el.textContent=v; } }
  updPanel(){
    const K=this.kpi, Dp=this.disp, f=0.35;
    Dp.ped=lerp(Dp.ped,K.ped,f); Dp.ent=lerp(Dp.ent,K.ent,f); Dp.ot=lerp(Dp.ot,K.on/K.ent*100,f); Dp.km=lerp(Dp.km,K.km,f);
    if(Math.abs(Dp.ped-K.ped)<.5) Dp.ped=K.ped; if(Math.abs(Dp.ent-K.ent)<.5) Dp.ent=K.ent;
    this.set('clk', hhmm(this.clock));
    this.set('ped', String(Math.round(Dp.ped))); this.set('ent', String(Math.round(Dp.ent)));
    this.set('ot', dec1(Dp.ot)); this.set('km', dec1(Dp.km));
    this.set('m-ent', String(Math.round(Dp.ent))); this.set('m-ot', Math.round(Dp.ot)+' %');
    const avail=this.V.filter(v=>!v.plan.length).length;
    this.set('av', avail ? `${avail} disponible${avail>1?'s':''}` : 'todos en ruta');
    this.V.forEach((v,i)=>{
      const el=this.vEl[i];
      const status = v.state==='dwell' && v.doneN && v.path.stops.length ? 'entregando' : (v.plan.length ? 'en ruta' : 'disponible');
      const cls = status==='entregando'?'st d':status==='en ruta'?'st r':'st f';
      if(el._s!==status){ el._s=status; el.st.textContent=status; el.st.className=cls; }
      const tot=v.doneN+v.plan.length, pct=tot?v.doneN/tot*100:100;
      const w=pct.toFixed(1)+'%'; if(el._w!==w){ el._w=w; el.bar.style.width=w; }
      const pr=`${v.doneN}/${tot}`; if(el._p!==pr){ el._p=pr; el.pr.textContent=pr; }
      const ns=v.path.stops[v.si];
      let nx='regresa al despacho', eta='—';
      if(ns){ const sec=((ns.s-v.s)/(v.base*.72)+(v.state==='dwell'?v.timer:0))*SIM; nx='próx. '+ns.st.barrio; eta='ETA '+hhmm(this.clock+sec); }
      else if(v.state==='load'){ nx='cargando en despacho'; }
      if(el._n!==nx){ el._n=nx; el.nx.textContent=nx; }
      if(el._e!==eta){ el._e=eta; el.eta.textContent=eta; }
      const hl=v.hl>0; if(el._h!==hl){ el._h=hl; el.root.classList.toggle('hl',hl); }
    });
    if(this.feedDirty){ this.feedDirty=false; this.feedEl.innerHTML=this.feed.slice().reverse().map(r=>`<div class="fr"><time>${r.t}</time><span>${r.html}</span></div>`).join(''); }
  }

  /* ---------------- layout y mapa estático ---------------- */
  layout(){
    const W0=this.stage.clientWidth, H0=this.stage.clientHeight;
    if(!W0||!H0) return;
    const size = (W0>=760&&H0>=430)?'lg':(W0>=540&&H0>=290)?'md':(W0>=400&&H0>=250)?'sm':'xs';
    if(this.size!==size){ this.size=size; this.root.className='fl '+size; }
    const W=this.mapEl.clientWidth, H=this.mapEl.clientHeight, dpr=Math.min(2, window.devicePixelRatio||1);
    if(!W||!H) return;
    if(W===this.W&&H===this.H&&dpr===this.dpr&&!this.forceStatic) return;
    this.W=W; this.H=H; this.dpr=dpr; this.forceStatic=false;
    for(const c of [this.cv, this.sCan]){ c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); }
    const k = size==='lg'?1:size==='md'?.84:size==='sm'?.8:.7;
    const padT = size==='xs'?30:size==='lg'?44:38, padB = size==='xs'?20:28, padX=8;
    const crop = size==='lg'?1.0:size==='md'?1.07:1.1;
    const sc=Math.min((W-2*padX)/ROI.w, (H-padT-padB)/ROI.h)*crop;
    this.k=k; this.sc=sc;
    this.ox = padX + ((W-2*padX) - ROI.w*sc)/2 - ROI.x*sc;
    this.oy = padT + ((H-padT-padB) - ROI.h*sc)/2 - ROI.y*sc;
    this.glow={};
    this.renderStatic();
    if(REDUCE) this.still(); else this.draw();
  }
  X(x){ return this.ox+x*this.sc; }
  Y(y){ return this.oy+y*this.sc; }

  renderStatic(){
    const c=this.sCtx, W=this.W, H=this.H, sc=this.sc, k=this.k, X=x=>this.X(x), Y=y=>this.Y(y);
    c.setTransform(this.dpr,0,0,this.dpr,0,0);
    c.fillStyle=COL.bg; c.fillRect(0,0,W,H);
    // luz ambiental muy suave
    let g=c.createRadialGradient(W*.42,H*.45,0,W*.42,H*.45,Math.max(W,H)*.7);
    g.addColorStop(0,'rgba(240,162,59,0.028)'); g.addColorStop(1,'rgba(240,162,59,0)'); c.fillStyle=g; c.fillRect(0,0,W,H);
    // parcelas
    const shades=['#141b18','#161e1a','#19221e'];
    for(let s=0;s<3;s++){ c.fillStyle=shades[s]; c.beginPath(); for(const r of LOTS[s]){ const x=X(r[0]), y=Y(r[1]), w=r[2]*sc, h=r[3]*sc; if(x>W||y>H||x+w<0||y+h<0) continue; c.rect(x,y,w,h); } c.fill(); }
    // parque principal
    const rect=(i0,j0,i1,j1,ins)=>[X(i0*BS+ins),Y(j0*BS+ins),(i1-i0)*BS*sc-2*ins*sc,(j1-j0)*BS*sc-2*ins*sc];
    const rr=(x,y,w,h,r)=>{ c.beginPath(); c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h); };
    let [px,py,pw,ph]=rect(5,3,7,4,6.5);
    rr(px,py,pw,ph,3*k); c.fillStyle='rgba(63,182,139,0.075)'; c.fill(); c.strokeStyle='rgba(63,182,139,0.22)'; c.lineWidth=1; c.stroke();
    c.save(); c.beginPath(); c.rect(px,py,pw,ph); c.clip();
    c.strokeStyle='rgba(63,182,139,0.16)'; c.lineWidth=Math.max(1,1.6*sc);
    c.beginPath(); c.moveTo(px,py); c.lineTo(px+pw,py+ph); c.moveTo(px+pw,py); c.lineTo(px,py+ph); c.moveTo(px+pw/2,py); c.lineTo(px+pw/2,py+ph); c.stroke();
    c.beginPath(); c.arc(px+pw/2,py+ph/2,Math.max(4,9*sc),0,Math.PI*2); c.fillStyle='#0f1814'; c.fill(); c.stroke();
    c.fillStyle='rgba(63,182,139,0.30)';
    c.beginPath(); for(const t of TREES){ const x=X(t[0]), y=Y(t[1]); c.moveTo(x+t[2]*sc*1.3,y); c.arc(x,y,Math.max(.8,t[2]*sc*1.3),0,Math.PI*2); } c.fill();
    c.restore();
    // polideportivo
    [px,py,pw,ph]=rect(1,1,3,2,7);
    rr(px,py,pw,ph,3*k); c.fillStyle='rgba(63,182,139,0.04)'; c.fill(); c.strokeStyle='rgba(63,182,139,0.14)'; c.lineWidth=1; c.stroke();
    c.beginPath(); c.ellipse(px+pw/2,py+ph/2,pw*.42,ph*.36,0,0,Math.PI*2); c.strokeStyle='rgba(63,182,139,0.22)'; c.lineWidth=Math.max(1,2.2*sc); c.stroke();
    c.beginPath(); c.rect(px+pw*.27,py+ph*.3,pw*.46,ph*.4); c.strokeStyle='rgba(63,182,139,0.13)'; c.lineWidth=1; c.stroke();
    // terminal
    [px,py,pw,ph]=rect(9,6,11,7,6.5);
    rr(px,py,pw,ph,3*k); c.fillStyle='rgba(240,162,59,0.035)'; c.fill(); c.strokeStyle='rgba(240,162,59,0.18)'; c.lineWidth=1; c.stroke();
    c.fillStyle='#171f1b'; c.fillRect(px+pw*.08,py+ph*.12,pw*.84,ph*.26);
    c.strokeStyle='rgba(240,162,59,0.16)'; c.lineWidth=1; c.beginPath();
    for(let q=0;q<7;q++){ const bx=px+pw*(.12+q*.12); c.moveTo(bx,py+ph*.88); c.lineTo(bx+pw*.06,py+ph*.52); } c.stroke();
    // calles
    const wid={ minor:Math.max(1.4,4.6*sc), diag:Math.max(2,7.5*sc), ave:Math.max(2,7.5*sc), main:Math.max(2.8,11.5*sc) };
    const colr={ minor:'#1f2925', diag:'#27322d', ave:'#27322d', main:'#2e3934' };
    c.lineCap='round'; c.lineJoin='round';
    for(const cl of ['minor','diag','ave','main']){
      c.beginPath();
      for(const e of E){ if(e.cls!==cl||e.removed) continue; const a=N[e.a], b=N[e.b]; c.moveTo(X(a.x),Y(a.y)); c.lineTo(X(b.x),Y(b.y)); }
      c.strokeStyle=colr[cl]; c.lineWidth=wid[cl]; c.stroke();
    }
    // separador central de la avenida principal
    c.beginPath(); for(const e of E){ if(e.cls!=='main'||e.removed) continue; const a=N[e.a], b=N[e.b]; c.moveTo(X(a.x),Y(a.y)); c.lineTo(X(b.x),Y(b.y)); }
    c.strokeStyle='rgba(11,15,13,0.55)'; c.lineWidth=Math.max(.8,1.4*sc); c.stroke();
    // río
    const rpath=()=>{ c.beginPath(); RIV.forEach((p,i)=> i?c.lineTo(X(p.x),Y(p.y)):c.moveTo(X(p.x),Y(p.y))); };
    rpath(); c.strokeStyle='rgba(98,160,170,0.20)'; c.lineWidth=(RHALF*2+5)*sc+2; c.stroke();
    rpath(); c.strokeStyle=COL.bg; c.lineWidth=(RHALF*2+3)*sc; c.stroke();
    rpath(); c.strokeStyle='#0c1b1e'; c.lineWidth=RHALF*2*sc; c.stroke();
    rpath(); c.strokeStyle='rgba(98,160,170,0.07)'; c.lineWidth=RHALF*.9*sc; c.stroke();
    // puentes

    const a=posAt(P,s0,{}); c.moveTo(ox+a.x*sc+a.nx*lane, oy+a.y*sc+a.ny*lane);

  draw(){

      c.globalCompositeOperation='lighter';
      c.strokeStyle=rgba(v.col,.07); c.lineWidth=10*k; c.stroke();
      c.strokeStyle=rgba(v.col,.16); c.lineWidth=5*k; c.stroke();
      c.globalCompositeOperation='source-over';
      c.strokeStyle=rgba(v.col,.95); c.lineWidth=2*k; c.stroke();
      // flujo direccional
      c.setLineDash([1.5*k,13*k]); c.lineDashOffset=-t*26*k; c.strokeStyle='rgba(255,255,255,0.55)'; c.lineWidth=1.2*k; c.stroke(); c.setLineDash([]);

    }

      c.fillStyle='rgba(255,255,255,0.35)'; c.beginPath(); c.arc(.3*k,-.5*k,.7*k,0,Math.PI*2); c.fill();
      // caja de reparto
      c.beginPath(); c.roundRect?c.roundRect(-L/2,-3*k,L*.3,6*k,1.2*k):c.rect(-L/2,-3*k,L*.3,6*k); c.fillStyle=v.col; c.fill(); c.strokeStyle='rgba(11,15,13,0.9)'; c.lineWidth=1; c.stroke();
      c.fillStyle='rgba(11,15,13,0.35)'; c.fillRect(-L/2+1*k,-.4*k,L*.3-2*k,.8*k);
      c.fillStyle='#fff7e6'; c.fillRect(L/2-1.4*k,-.6*k,1.2*k,1.2*k);
    }
    c.restore();
    if(this.size==='lg'){
      const tw=26, th=12, bx=x-tw/2, by=y-th-11*k;
      c.beginPath(); c.roundRect?c.roundRect(bx,by,tw,th,3):c.rect(bx,by,tw,th); c.fillStyle='rgba(11,15,13,0.82)'; c.fill(); c.strokeStyle=rgba(v.col,.5); c.lineWidth=1; c.stroke();
      c.font=`600 7.5px ${FONT.mono}`; c.fillStyle=v.col; c.textAlign='center'; c.textBaseline='middle'; c.fillText(v.tag, x, by+th/2+.5);
    }
  }

  drawPin(p){
    const c=this.ctx, k=this.k, a=this.t-p.t0, x=this.X(p.x), y=this.Y(p.y), W=this.W;
    const pop=easeBack(clamp(a/0.42,0,1)), out=clamp((a-2.9)/0.45,0,1), al=1-out;
    // onda en el suelo
    if(a<1.1){ const q=a/1.1; c.beginPath(); c.ellipse(x,y,4*k+q*26*k,(4*k+q*26*k)*.55,0,0,Math.PI*2); c.strokeStyle=rgba(COL.grn,.7*(1-q)); c.lineWidth=1.5; c.stroke(); }
    c.globalAlpha=al;
    c.beginPath(); c.ellipse(x,y+1,4.5*k,2.2*k,0,0,Math.PI*2); c.fillStyle='rgba(0,0,0,0.5)'; c.fill();
    const hy=y-15*k*pop, r=6.2*k*pop;
    c.drawImage(this.glowSprite(COL.grn), x-18*k, hy-18*k, 36*k, 36*k);
    c.beginPath(); c.moveTo(x,y-1); c.lineTo(x-r*.72,hy+r*.55); c.arc(x,hy,r,Math.PI*.78,Math.PI*.22); c.closePath(); c.fillStyle=COL.grn; c.fill();
    c.strokeStyle='rgba(11,15,13,0.8)'; c.lineWidth=1; c.stroke();
    if(r>2){ c.beginPath(); c.moveTo(x-2.6*k,hy); c.lineTo(x-.7*k,hy+1.9*k); c.lineTo(x+2.8*k,hy-2*k); c.strokeStyle='#0b0f0d'; c.lineWidth=1.6*k; c.stroke(); }
    // tarjeta
    const ba=clamp((a-0.12)/0.3,0,1);
    if(ba>0 && this.size!=='xs'){
      const fs=(this.size==='lg'?10:9);
      c.font=`600 ${fs}px ${FONT.mono}`;
      const txt=p.label, tw=c.measureText(txt).width, bw=tw+24, bh=fs+10;
      let bx=x-bw/2, by=hy-r-bh-6-(1-easeOut(ba))*6;
      bx=clamp(bx,6,W-bw-6); if(by<48 || this.hitsToast(bx,by,bw,bh)) by=y+9;
      c.globalAlpha=al*ba;
      c.beginPath(); c.roundRect?c.roundRect(bx,by,bw,bh,bh/2):c.rect(bx,by,bw,bh); c.fillStyle='rgba(13,19,16,0.94)'; c.fill(); c.strokeStyle='rgba(63,182,139,0.6)'; c.lineWidth=1; c.stroke();
      const cx=bx+10, cy=by+bh/2;
      c.beginPath(); c.moveTo(cx-3,cy); c.lineTo(cx-1,cy+2.2); c.lineTo(cx+3.2,cy-2.4); c.strokeStyle=COL.grn; c.lineWidth=1.6; c.stroke();
      c.fillStyle=COL.tx; c.textAlign='left'; c.textBaseline='middle'; c.fillText(txt, bx+17, cy+.5);
    }
    c.globalAlpha=1;
  }

  drawChip(ch){
    const c=this.ctx, k=this.k, a=this.t-ch.t0, W=this.W, H=this.H;
    if(this.size==='xs' && !ch.big) return;
    const pop=easeBack(clamp(a/0.4,0,1)), al=1-clamp((a-3.8)/0.6,0,1);
    const fs=this.size==='lg'?10:9;
    c.font=`500 ${fs}px ${FONT.mono}`; const w1=c.measureText(ch.a).width;
    c.font=`700 ${fs}px ${FONT.mono}`; const w2=c.measureText(ch.b).width;
    c.font=`500 ${fs}px ${FONT.mono}`; const sep=c.measureText(' · ').width;
    const bw=w1+sep+w2+20, bh=fs+11;
    let x=this.X(ch.x), y=this.Y(ch.y)-(ch.big?30:24)*k;
    let bx=clamp(x-bw/2,6,W-bw-6), by=y-bh;
    if(by<46 || this.hitsToast(bx,by,bw,bh)) by=this.Y(ch.y)+18*k;
    if(by+bh>H-30) by=H-30-bh;
    c.save(); c.globalAlpha=al; c.translate(bx+bw/2,by+bh/2); c.scale(.85+.15*pop,.85+.15*pop); c.translate(-bx-bw/2,-by-bh/2);
    c.globalAlpha=al*clamp(a/0.25,0,1);
    c.beginPath(); c.roundRect?c.roundRect(bx,by,bw,bh,bh/2):c.rect(bx,by,bw,bh); c.fillStyle='rgba(13,19,16,0.95)'; c.fill();
    c.strokeStyle=rgba(ch.col,.75); c.lineWidth=1; c.stroke();
    c.textAlign='left'; c.textBaseline='middle'; const ty=by+bh/2+.5;
    c.font=`500 ${fs}px ${FONT.mono}`; c.fillStyle=COL.tx; c.fillText(ch.a, bx+10, ty);
    c.fillStyle=COL.tx2; c.fillText(' · ', bx+10+w1, ty);
    c.font=`700 ${fs}px ${FONT.mono}`; c.fillStyle=ch.big?COL.grn:ch.col; c.fillText(ch.b, bx+10+w1+sep, ty);
    c.restore();
  }

  /* fotograma fijo (prefers-reduced-motion) */
  still(){
    if(!this.stillDone){
      this.stillDone=true;
      this.initSim();
      for(let i=0;i<Math.round(6.55*30);i++) this.step(1/30);
      if(!this.pins.length){ const v=this.V.find(v=>v.done.length); if(v){ const st=v.done[v.done.length-1]; this.pins.push({ x:st.x, y:st.y, t0:this.t-1, label:'entregado '+hhmm(st.doneAt||this.clock), st }); } }
      else this.pins.forEach(p=>{ p.t0=Math.min(p.t0, this.t-1); });
      this.chips.forEach(ch=>{ ch.t0=Math.min(ch.t0, this.t-1.2); });
      for(const v of this.V){ v.reveal=1; v.ghost=null; }
      this.updPanel(); this.disp={ ped:this.kpi.ped, ent:this.kpi.ent, ot:this.kpi.on/this.kpi.ent*100, km:this.kpi.km }; this.updPanel();
    }
    this.draw();
  }
}

/* ================================================================== *
 *  Arranque y bucle único
 * ================================================================== */
const inst=[];
const lg=document.getElementById('stage-lg'), sm=document.getElementById('stage-sm');
inst.push(new Fleet(lg, 20261004));
if(!EMBED && sm) inst.push(new Fleet(sm, 777));

let raf=0, last=0;
function frame(now){
  raf=0;
  const dt=Math.min(0.05, Math.max(0,(now-last)/1000)); last=now;
  let any=false;
  for(const f of inst){ if(!f.vis) continue; any=true; f.step(dt); f.draw(); }
  if(any && !document.hidden) raf=requestAnimationFrame(frame);
}
function wake(){ if(REDUCE||raf||document.hidden) return; if(!inst.some(f=>f.vis)) return; last=performance.now(); raf=requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ if(raf) cancelAnimationFrame(raf); raf=0; } else wake(); });
if(REDUCE) inst.forEach(f=>f.still()); else wake();

// las fuentes del lienzo pueden llegar después: volver a pintar el mapa estático
if(document.fonts && document.fonts.load){
  Promise.all([document.fonts.load(`600 10px Inter`), document.fonts.load(`italic 500 10px Inter`), document.fonts.load(`600 10px "JetBrains Mono"`), document.fonts.load(`500 10px "JetBrains Mono"`)])
    .then(()=>document.fonts.ready)
    .then(()=>inst.forEach(f=>{ f.forceStatic=true; f.layout(); }))
    .catch(err=>console.warn('fuentes no disponibles, se usa la de sistema', err));
}
})();
</script>
